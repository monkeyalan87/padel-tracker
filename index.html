<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Tracker - Auth Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDog2f8jYrxm7J19h6QOtTUsuDgiNUmtSU",
          authDomain: "padel-tracker-uk.firebaseapp.com",
          projectId: "padel-tracker-uk",
          storageBucket: "padel-tracker-uk.firebasestorage.app",
          messagingSenderId: "557326239556",
          appId: "1:557326239556:web:4bb796309b0eac6697f911"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const ADMIN_EMAILS = ['edavies87@gmail.com'];

        auth.onAuthStateChanged((user) => {
            const root = document.getElementById('root');
            
            if (user) {
                const isAdmin = ADMIN_EMAILS.includes(user.email);
                root.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full text-center">
                            <div class="text-6xl mb-4">✅</div>
                            <h1 class="text-2xl font-bold mb-4">Authentication Working!</h1>
                            <p class="text-gray-600 mb-2">Signed in as:</p>
                            <p class="font-semibold mb-4">${user.email}</p>
                            <p class="text-sm mb-6">
                                ${isAdmin ? '👑 You are an <strong>ADMIN</strong>' : '👤 You are a <strong>Regular Player</strong>'}
                            </p>
                            <button onclick="firebase.auth().signOut()" 
                                class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700">
                                Sign Out
                            </button>
                        </div>
                    </div>
                `;
            } else {
                root.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
                            <div class="text-center mb-8">
                                <div class="text-6xl mb-4">🎾</div>
                                <h1 class="text-3xl font-bold text-gray-900 mb-2">Padel Tracker</h1>
                                <p class="text-gray-600">Authentication Test</p>
                            </div>

                            <button onclick="signInWithGoogle()" 
                                class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-300 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-50 mb-3">
                                <svg class="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Sign in with Google
                            </button>

                            <button onclick="signInWithApple()" 
                                class="w-full flex items-center justify-center gap-3 bg-black text-white py-3 rounded-lg font-medium hover:bg-gray-900">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                                </svg>
                                Sign in with Apple
                            </button>
                        </div>
                    </div>
                `;
            }
        });

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert('Error: ' + err.message));
        }

        function signInWithApple() {
            const provider = new firebase.auth.OAuthProvider('apple.com');
            auth.signInWithPopup(provider).catch(err => alert('Error: ' + err.message));
        }
    </script>
</body>
</html>
