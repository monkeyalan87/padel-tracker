// Tournament Algorithms
function generateAmericanoPairings(playerIds, numCourts) {
  const n = playerIds.length;
  if (n < 4 || n % 2 !== 0) return null;
  
  const rounds = [];
  const numRounds = n - 1;
  const players = [...playerIds];
  
  for (let round = 0; round < numRounds; round++) {
    const roundMatches = [];
    const matchesPerRound = Math.floor(n / 4);
    
    for (let i = 0; i < matchesPerRound; i++) {
      const team1Player1 = players[i * 2];
      const team1Player2 = players[n - 1 - (i * 2)];
      const team2Player1 = players[i * 2 + 1];
      const team2Player2 = players[n - 2 - (i * 2)];
      
      roundMatches.push({
        court: (i % numCourts) + 1,
        team1: [team1Player1, team1Player2],
        team2: [team2Player1, team2Player2],
        score: { team1: '', team2: '' }
      });
    }
    
    rounds.push({ number: round + 1, matches: roundMatches, completed: false });
    
    const lastPlayer = players.pop();
    players.splice(1, 0, lastPlayer);
  }
  
  return rounds;
}

function generateMexicanoRound(playerIds, numCourts, currentStandings = null) {
  const n = playerIds.length;
  if (n < 4 || n % 2 !== 0) return null;
  
  let orderedPlayers;
  
  if (!currentStandings) {
    orderedPlayers = [...playerIds].sort(() => Math.random() - 0.5);
  } else {
    orderedPlayers = [...currentStandings].sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      return b.gamesWon - a.gamesWon;
    }).map(p => p.id);
  }
  
  const roundMatches = [];
  const matchesPerRound = Math.floor(n / 4);
  
  for (let i = 0; i < matchesPerRound; i++) {
    const baseIdx = i * 4;
    roundMatches.push({
      court: (i % numCourts) + 1,
      team1: [orderedPlayers[baseIdx], orderedPlayers[baseIdx + 3]],
      team2: [orderedPlayers[baseIdx + 1], orderedPlayers[baseIdx + 2]],
      score: { team1: '', team2: '' }
    });
  }
  
  return roundMatches;
}

  const filteredMatches = isAdmin ? matches : matches.filter(m =>

  );

  const addPlayer = async () => {
    if (playerForm.name.trim()) {
      await db.collection('players').add({
        name: playerForm.name.trim(),
        paypalLink: playerForm.paypalLink.trim(),
        revolutLink: playerForm.revolutLink.trim(),
        sortCode: playerForm.sortCode.trim(),
        accountNumber: playerForm.accountNumber.trim(),

      });
      setPlayerForm({ name: '', paypalLink: '', revolutLink: '', sortCode: '', accountNumber: '', email: '' });
      setShowNewPlayer(false);
    }

      await db.collection('players').doc(editingPlayer).update({
        name: playerForm.name.trim(),
        paypalLink: playerForm.paypalLink.trim(),
        revolutLink: playerForm.revolutLink.trim(),
        sortCode: playerForm.sortCode.trim(),
        accountNumber: playerForm.accountNumber.trim(),
        email: playerForm.email.trim()
      });
      setEditingPlayer(null);
      setPlayerForm({ name: '', paypalLink: '', revolutLink: '', sortCode: '', accountNumber: '', email: '' });
    }
  };

  const createMatch = async () => {
    // For open registration matches
    if (newMatch.openRegistration && newMatch.courtFee) {
      const matchData = {
        ...newMatch,
        courtFee: parseFloat(newMatch.courtFee),
        players: [],
        openRegistration: true,
        maxPlayers: newMatch.maxPlayers,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      
      const docRef = await db.collection('matches').add(matchData);
      
      // Show shareable link
      const shareUrl = `${window.location.origin}${window.location.pathname}?match=${docRef.id}`;
      alert(`Match created! Share this link:\n${shareUrl}\n\nClick OK to copy to clipboard.`);
      navigator.clipboard.writeText(shareUrl);
      
      setNewMatch({
        date: new Date().toISOString().split('T')[0],
        time: '', courtFee: '', courts: 1, format: 'open', location: '', selectedPlayers: [], paymentOrganizer: null, openRegistration: false, maxPlayers: 4
      });
      setShowNewMatch(false);
      return;
    }
    
    // For regular matches with selected players
    if (newMatch.selectedPlayers.length >= 4 && newMatch.courtFee) {
      const costPerPlayer = parseFloat(newMatch.courtFee) / newMatch.selectedPlayers.length;
      
      await db.collection('matches').add({
        ...newMatch,
        courtFee: parseFloat(newMatch.courtFee),
        costPerPlayer: costPerPlayer,
        players: newMatch.selectedPlayers.map(id => {
          const player = players.find(p => p.id === id);
          return { 
            id, 
            name: player.name, 
            paid: id === newMatch.paymentOrganizer
          };
        }),
        openRegistration: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      setNewMatch({
        date: new Date().toISOString().split('T')[0],
        time: '', courtFee: '', courts: 1, format: 'open', location: '', selectedPlayers: [], paymentOrganizer: null, openRegistration: false, maxPlayers: 4
      });
      setShowNewMatch(false);
    }
  };

  const togglePayment = async (matchId, playerId) => {
    if (!isAdmin && userPlayer?.id !== playerId) {
      alert('You can only mark yourself as paid');
      return;
    }
    
    const match = matches.find(m => m.id === matchId);
    const updatedPlayers = match.players.map(p => 
      p.id === playerId ? { ...p, paid: !p.paid } : p
    );
    await db.collection('matches').doc(matchId).update({ players: updatedPlayers });
  };

  const joinMatch = async (matchId, playerId = null) => {
    // If no playerId provided, use userPlayer (for regular users)
    const playerToJoin = playerId || userPlayer?.id;
    
    if (!playerToJoin) {
      alert('Please select a player to join as');
      return;
    }

    const match = matches.find(m => m.id === matchId);
    
    if (match.players.length >= match.maxPlayers) {
      alert('This match is full');
      return;
    }

    if (match.players.some(p => p.id === playerToJoin)) {
      alert('This player has already joined this match');
      return;
    }

    const player = players.find(p => p.id === playerToJoin);
    const updatedPlayers = [...match.players, { 
      id: playerToJoin, 
      name: player.name, 
      paid: false 
    }];

    // Recalculate cost per player
    const costPerPlayer = match.courtFee / updatedPlayers.length;

    await db.collection('matches').doc(matchId).update({ 
      players: updatedPlayers,
      costPerPlayer: costPerPlayer
    });
  };

  const leaveMatch = async (matchId, playerId = null) => {
    const playerToRemove = playerId || userPlayer?.id;
    
    if (!playerToRemove) return;

    const match = matches.find(m => m.id === matchId);
    const updatedPlayers = match.players.filter(p => p.id !== playerToRemove);

    // Recalculate cost per player
    const costPerPlayer = updatedPlayers.length > 0 ? match.courtFee / updatedPlayers.length : 0;

    await db.collection('matches').doc(matchId).update({ 
      players: updatedPlayers,
      costPerPlayer: costPerPlayer
    });
  };

  const deleteMatch = async (matchId) => {
    if (!isAdmin) {
      alert('Only admins can delete matches');
      return;
    }
    if (confirm('Are you sure you want to delete this match?')) {
      await db.collection('matches').doc(matchId).delete();
    }
  };

  const showTournamentPointsDialog = (match) => {
    setPendingTournament(match);
    setShowPointsModal(true);
  };

  const startTournamentWithPoints = async (targetPoints) => {
    if (!pendingTournament) return;
    
    const match = pendingTournament;
    const playerIds = match.players.map(p => p.id);
    
    let rounds;
    if (match.format === 'americano') {
      rounds = generateAmericanoPairings(playerIds, match.courts);
    } else {
      const firstRound = generateMexicanoRound(playerIds, match.courts, null);
      rounds = [{ number: 1, matches: firstRound, completed: false }];
    }

    if (!rounds) {
      alert('Invalid number of players. Need even number (minimum 4)');
      return;
    }

    await db.collection('matches').doc(match.id).update({
      tournamentStarted: true,
      tournamentRounds: rounds,
      tournamentPlayers: match.players.map(p => ({ ...p, points: 0, gamesWon: 0 })),
      targetPoints: targetPoints,
      currentRoundNumber: 1
    });
    
    setShowPointsModal(false);
    setPendingTournament(null);
  };

  const updateMatchScore = async (matchId, roundIdx, matchIdx, team, value) => {
    const match = matches.find(m => m.id === matchId);
    const newRounds = [...match.tournamentRounds];
    newRounds[roundIdx].matches[matchIdx].score[team] = value;
    
    await db.collection('matches').doc(matchId).update({
      tournamentRounds: newRounds
    });
  };

  const completeRound = async (matchId, roundIdx) => {
    const match = matches.find(m => m.id === matchId);
    const newRounds = [...match.tournamentRounds];
    
    // Check all scores are filled
    const allScored = newRounds[roundIdx].matches.every(m => m.score.team1 && m.score.team2);
    if (!allScored) {
      alert('Please enter all scores for this round');
      return;
    }

    newRounds[roundIdx].completed = true;

    // Calculate points
    const playerPoints = {};
    match.tournamentPlayers.forEach(p => {
      playerPoints[p.id] = { points: 0, gamesWon: 0 };
    });

    newRounds.forEach(round => {
      if (!round.completed && round.number !== roundIdx + 1) return;
      
      round.matches.forEach(m => {
        const s1 = parseInt(m.score.team1) || 0;
        const s2 = parseInt(m.score.team2) || 0;
        
        m.team1.forEach(pid => {
          playerPoints[pid].points += s1;
          if (s1 > s2) playerPoints[pid].gamesWon++;
        });
        
        m.team2.forEach(pid => {
          playerPoints[pid].points += s2;
          if (s2 > s1) playerPoints[pid].gamesWon++;
        });
      });
    });

    const updatedPlayers = match.tournamentPlayers.map(p => ({
      ...p,
      points: playerPoints[p.id].points,
      gamesWon: playerPoints[p.id].gamesWon
    }));

    const updateData = {
      tournamentRounds: newRounds,
      tournamentPlayers: updatedPlayers
    };

    // For Mexicano, generate next round
    if (match.format === 'mexicano' && roundIdx + 1 < 10) {
      const nextRound = generateMexicanoRound(
        match.players.map(p => p.id),
        match.courts,
        updatedPlayers
      );
      
      if (nextRound) {
        newRounds.push({
          number: roundIdx + 2,
          matches: nextRound,
          completed: false
        });
        updateData.tournamentRounds = newRounds;
        updateData.currentRoundNumber = roundIdx + 2;
      }
    } else if (match.format === 'americano') {
      updateData.currentRoundNumber = roundIdx + 2;
    }

    await db.collection('matches').doc(matchId).update(updateData);
  };

  const totalRev = matches.reduce((s, m) => s + (m.courtFee || 0), 0);
  const totalCol = matches.reduce((s, m) => {
    const paid = (m.players || []).filter(p => p.paid).length;
    return s + ((m.courtFee || 0) / m.players.length) * paid;
  }, 0);

  if (loading) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center">
        <div className="text-6xl">🎾</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
      {showPointsModal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg shadow-xl max-w-sm w-full p-6">
            <h3 className="text-xl font-bold mb-4">Select Points Per Match</h3>
            <p className="text-gray-600 mb-6">How many points should each match be played to?</p>
            
            <div className="space-y-3">
              <button 
                onClick={() => startTournamentWithPoints(16)}
                className="w-full py-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-lg">
                16 Points
              </button>
              
              <button 
                onClick={() => startTournamentWithPoints(32)}
                className="w-full py-4 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-semibold text-lg">
                32 Points
              </button>

              <button 
                onClick={() => {
                  setShowPointsModal(false);
                  setPendingTournament(null);
                }}
                className="w-full py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="bg-white shadow-sm border-b">
        <div className="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
          <div>
            <h1 className="text-2xl font-bold">Padel Tracker</h1>
            <p className="text-sm text-gray-600">
              {isAdmin ? '👑 Admin' : `👤 ${userPlayer?.name}`}
            </p>
          </div>
          <button onClick={onLogout} className="text-gray-600 hover:text-gray-900">
            <Icon name="log-out" />
          </button>
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-4">
        <div className="bg-white rounded-lg shadow-sm p-1 grid grid-cols-4 gap-1">
          {['matches', 'stats', 'admin', 'players'].map(tab => (
            <button key={tab} onClick={() => setView(tab)}
              className={`py-2 px-2 rounded-md text-xs font-medium ${
                view === tab ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-100'
              }`}>
              {tab.charAt(0).toUpperCase() + tab.slice(1)}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 pb-24">
        {view === 'matches' && (
          <div className="space-y-4">
            {filteredMatches.filter(m => new Date(m.date + ' ' + (m.time || '00:00')) >= new Date()).length === 0 && (
              <div className="bg-white rounded-lg shadow-sm p-8 text-center">
                <div className="text-6xl mb-4">📅</div>
                <p className="text-gray-600">{isAdmin ? 'No upcoming matches' : 'No upcoming matches for you'}</p>
              </div>
            )}

            {filteredMatches
              .filter(m => new Date(m.date + ' ' + (m.time || '00:00')) >= new Date())
              .map(m => (
                <MatchCard 
                  key={m.id}
                  match={m}
                  players={players}
                  isAdmin={isAdmin}
                  userPlayer={userPlayer}
                  onDelete={deleteMatch}
                  onTogglePayment={togglePayment}
                  onJoinMatch={joinMatch}
                  onLeaveMatch={leaveMatch}
                  onStartTournament={showTournamentPointsDialog}
                  onUpdateScore={updateMatchScore}
                  onCompleteRound={completeRound}
                />
              ))}

            {isAdmin && (
              <button onClick={() => setShowNewMatch(!showNewMatch)}
                className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center justify-center gap-2">
                <Icon name={showNewMatch ? "x" : "plus"} />
                {showNewMatch ? 'Cancel' : 'New Match'}
              </button>
            )}

            {isAdmin && showNewMatch && (
              <NewMatchForm 
                newMatch={newMatch}
                setNewMatch={setNewMatch}
                players={players}
                locations={locs}
                onCreate={createMatch}
              />
            )}
          </div>
        )}

        {view === 'stats' && (
          <div className="space-y-4">
            <div className="bg-white rounded-lg shadow-sm p-6">
              <h2 className="text-xl font-bold mb-4">Statistics</h2>
              <div className="grid grid-cols-2 gap-4 mb-6">
                <div className="p-4 bg-green-50 rounded-lg">
                  <div className="text-2xl font-bold text-green-600">£{totalRev.toFixed(2)}</div>
                  <div className="text-sm text-gray-600">Total Revenue</div>
                </div>
                <div className="p-4 bg-blue-50 rounded-lg">
                  <div className="text-2xl font-bold text-blue-600">£{totalCol.toFixed(2)}</div>
                  <div className="text-sm text-gray-600">Collected</div>
                </div>
              </div>
            </div>

            {/* Historical Matches */}
            <div className="bg-white rounded-lg shadow-sm p-4">
              <h3 className="font-semibold mb-3">Match History</h3>
              <div className="space-y-3">
                {filteredMatches
                  .filter(m => new Date(m.date + ' ' + (m.time || '00:00')) < new Date())
                  .map(m => {
                    const isTournament = m.format === 'americano' || m.format === 'mexicano';
                    const hasScores = m.matchScores && m.matchScores.some(s => s.team1 || s.team2);
                    
                    return (
                      <div key={m.id} className="border rounded-lg p-3">
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-semibold text-sm">{new Date(m.date).toLocaleDateString('en-GB')}</span>
                              <span className={`px-2 py-0.5 text-xs rounded-full ${
                                m.format === 'open' ? 'bg-blue-100 text-blue-700' :
                                m.format === 'americano' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'
                              }`}>{m.format === 'open' ? 'Open' : m.format === 'americano' ? 'Americano' : 'Mexicano'}</span>
                            </div>
                            {m.location && <p className="text-xs text-gray-500">📍 {m.location}</p>}
                            {m.startTime && m.endTime && (
                              <p className="text-xs text-gray-500">⏱️ {m.startTime} - {m.endTime}</p>
                            )}
                          </div>
                        </div>

                        <div className="text-xs text-gray-600 mb-2">
                          {(m.players || []).map(p => p.name).join(', ')}
                        </div>

                        {/* Show Open match scores */}
                        {!isTournament && hasScores && (
                          <div className="mt-2 pt-2 border-t">
                            <div className="flex gap-3 text-center">
                              {m.matchScores.map((set, idx) => (
                                <div key={idx}>
                                  <div className="text-xs text-gray-500">Set {idx + 1}</div>
                                  <div className="font-bold text-sm">{set.team1 || '-'} - {set.team2 || '-'}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* Show tournament winner */}
                        {isTournament && m.tournamentPlayers && m.tournamentPlayers.length > 0 && (
                          <div className="mt-2 pt-2 border-t">
                            <div className="text-xs text-gray-600">
                              Winner: <span className="font-semibold">{
                                [...m.tournamentPlayers].sort((a, b) => {
                                  if (b.points !== a.points) return b.points - a.points;
                                  return b.gamesWon - a.gamesWon;
                                })[0]?.name
                              }</span> ({
                                [...m.tournamentPlayers].sort((a, b) => {
                                  if (b.points !== a.points) return b.points - a.points;
                                  return b.gamesWon - a.gamesWon;
                                })[0]?.points
                              } pts)
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                
                {filteredMatches.filter(m => new Date(m.date + ' ' + (m.time || '00:00')) < new Date()).length === 0 && (
                  <p className="text-center text-gray-500 py-8">No completed matches yet</p>
                )}
              </div>
            </div>
          </div>
        )}

        {view === 'players' && (
          <PlayersView 
            players={players}
            isAdmin={isAdmin}
            showNewPlayer={showNewPlayer}
            setShowNewPlayer={setShowNewPlayer}
            playerForm={playerForm}
            setPlayerForm={setPlayerForm}
            editingPlayer={editingPlayer}
            setEditingPlayer={setEditingPlayer}
            onAddPlayer={addPlayer}
            onUpdatePlayer={updatePlayer}
          />
        )}

        {view === 'admin' && isAdmin && (
          <div className="bg-white rounded-lg shadow-sm p-6">
            <h2 className="text-xl font-bold mb-4">Admin Panel</h2>
            <div className="space-y-4">
              <div className="p-4 border rounded-lg">
                <h3 className="font-semibold mb-2">Quick Stats</h3>
                <div className="grid grid-cols-2 gap-3 text-sm">
                  <div>Total Players: <strong>{players.length}</strong></div>
                  <div>Total Matches: <strong>{matches.length}</strong></div>
                  <div>Revenue: <strong>£{totalRev.toFixed(2)}</strong></div>
                  <div>Collected: <strong>£{totalCol.toFixed(2)}</strong></div>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MatchCard({ match, players, isAdmin, userPlayer, onDelete, onTogglePayment, onJoinMatch, onLeaveMatch, onStartTournament, onUpdateScore, onCompleteRound }) {
  const [showScoreInput, setShowScoreInput] = useState(false);
  const [matchScores, setMatchScores] = useState(match.matchScores || [
    { team1: '', team2: '' },
    { team1: '', team2: '' },
    { team1: '', team2: '' }
  ]);
  const [showTimeModal, setShowTimeModal] = useState(false);
  const [startTime, setStartTime] = useState(match.startTime || '');
  const [endTime, setEndTime] = useState(match.endTime || '');
  const [showShareModal, setShowShareModal] = useState(false);
  const [showAdminJoinModal, setShowAdminJoinModal] = useState(false);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);

  const mDate = new Date(match.date + ' ' + (match.time || '00:00'));
  const isUp = mDate >= new Date();
  const isTournament = match.format === 'americano' || match.format === 'mexicano';
  const canEdit = isAdmin;
  const isOpenRegistration = match.openRegistration;
  const hasJoined = match.players?.some(p => p.id === userPlayer?.id);
  const isFull = match.players?.length >= match.maxPlayers;

  const shareMatch = () => {
    const shareUrl = `${window.location.origin}${window.location.pathname}?match=${match.id}`;
    navigator.clipboard.writeText(shareUrl);
    setShowShareModal(true);
    setTimeout(() => setShowShareModal(false), 3000);
  };

  const handleAdminJoin = () => {
    if (isAdmin && !userPlayer) {
      setShowAdminJoinModal(true);
    } else {
      onJoinMatch(match.id);
    }
  };

  const confirmAdminJoin = () => {
    if (selectedPlayerId) {
      onJoinMatch(match.id, selectedPlayerId);
      setShowAdminJoinModal(false);
      setSelectedPlayerId(null);
    }
  };

  const saveMatchScores = async () => {
    await db.collection('matches').doc(match.id).update({
      matchScores: matchScores
    });
    setShowScoreInput(false);
  };

  const saveMatchTime = async () => {
    if (!startTime || !endTime) {
      alert('Please enter both start and end times');
      return;
    }
    await db.collection('matches').doc(match.id).update({
      startTime: startTime,
      endTime: endTime
    });
    setShowTimeModal(false);
  };

  if (isTournament && match.tournamentStarted) {
    return <TournamentCard match={match} players={players} isAdmin={canEdit} onUpdateScore={onUpdateScore} onCompleteRound={onCompleteRound} onDelete={onDelete} />;
  }

  return (
    <div className="bg-white rounded-lg shadow-sm p-4">
      {showShareModal && (
        <div className="mb-3 p-2 bg-green-100 text-green-800 rounded text-sm text-center">
          ✓ Link copied to clipboard!
        </div>
      )}

      <div className="flex justify-between mb-3">
        <div className="flex-1">
          <div className="flex items-center gap-2 mb-1">
            <h3 className="font-semibold">{match.courts} Court{match.courts > 1 ? 's' : ''}</h3>
            <span className={`px-2 py-0.5 text-xs rounded-full ${
              match.format === 'open' ? 'bg-blue-100 text-blue-700' :
              match.format === 'americano' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'
            }`}>{match.format === 'open' ? 'Open' : match.format === 'americano' ? 'Americano' : 'Mexicano'}</span>
            {isOpenRegistration && (
              <span className="px-2 py-0.5 bg-orange-100 text-orange-700 text-xs rounded-full">
                Open Sign-Up {match.players?.length || 0}/{match.maxPlayers}
              </span>
            )}
            {isUp && <span className="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded-full">Upcoming</span>}
          </div>
          <p className="text-sm text-gray-600">{new Date(match.date).toLocaleDateString('en-GB')} {match.time && `at ${match.time}`}</p>
          {match.location && <p className="text-xs text-gray-500">📍 {match.location}</p>}
          {match.startTime && match.endTime && (
            <p className="text-xs text-gray-500">⏱️ {match.startTime} - {match.endTime}</p>
          )}
          {!isOpenRegistration && <p className="text-xs text-gray-500 mt-1">{(match.players || []).map(p => p.name).join(', ')}</p>}
        </div>
        <div className="flex gap-2">
          {isOpenRegistration && canEdit && (
            <button 
              onClick={shareMatch}
              className="text-gray-600 hover:text-blue-600"
              title="Share match link">
              <Icon name="share-2" />
            </button>
          )}
          {!isUp && canEdit && !isTournament && (
            <>
              <button 
                onClick={() => setShowTimeModal(true)}
                className="text-gray-600 hover:text-indigo-600"
                title="Set match time">
                <Icon name="clock" />
              </button>
              <button 
                onClick={() => setShowScoreInput(true)}
                className="text-gray-600 hover:text-green-600"
                title="Input scores">
                <Icon name="clipboard" />
              </button>
            </>
          )}
          {canEdit && (
            <button onClick={() => onDelete(match.id)} className="text-gray-400 hover:text-red-500">
              <Icon name="trash-2" />
            </button>
          )}
        </div>
      </div>

      {/* Open Registration Section */}
      {isOpenRegistration && (
        <div className="space-y-3 mt-3 p-3 border-2 border-orange-300 rounded-lg bg-orange-50">
          <div className="text-xs font-semibold text-orange-700 mb-2">OPEN REGISTRATION MODE</div>
          
          {/* Join/Leave buttons - only for upcoming matches */}
          {isUp && !match.tournamentStarted && (
            <div className="flex gap-2">
              {!hasJoined ? (
                <button
                  onClick={handleAdminJoin}
                  disabled={isFull}
                  className="flex-1 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed font-semibold text-lg">
                  {isFull ? '❌ Match Full' : '✅ Join Match'}
                </button>
              ) : (
                <button
                  onClick={() => onLeaveMatch(match.id)}
                  className="flex-1 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold text-lg">
                  ❌ Leave Match
                </button>
              )}
            </div>
          )}

          {/* Show message if match is in the past */}
          {!isUp && (
            <div className="p-3 bg-gray-100 rounded text-center text-sm text-gray-600">
              This match has already taken place
            </div>
          )}

          {/* Players list */}
          {match.costPerPlayer && match.players && match.players.length > 0 && (
            <div className="p-2 bg-yellow-50 border border-yellow-200 rounded text-center">
              <span className="text-sm font-semibold text-yellow-900">£{match.costPerPlayer.toFixed(2)} per player</span>
            </div>
          )}

          <div className="space-y-2">
            <h4 className="text-sm font-semibold">
              Players ({match.players?.length || 0}/{match.maxPlayers})
            </h4>
            {match.players && match.players.length > 0 ? (
              <div className="grid grid-cols-2 gap-2">
                {match.players.map(p => {
                  const playerInfo = players.find(pl => pl.id === p.id);
                  const canPay = isAdmin || userPlayer?.id === p.id;
                  const isOrganizer = p.id === match.paymentOrganizer;
                  
                  return (
                    <div key={p.id} className={`border-2 rounded-lg p-2 ${isOrganizer ? 'border-green-500 bg-green-50' : 'border-gray-200'}`}>
                      <div onClick={() => canPay && onTogglePayment(match.id, p.id)}
                        className={`flex items-center justify-between p-1 rounded ${canPay ? 'cursor-pointer hover:bg-gray-50' : 'opacity-50'}`}>
                        <div>
                          <span className="text-sm font-medium">{p.name}</span>
                          {isOrganizer && <span className="ml-1 text-xs text-green-700">💰</span>}
                        </div>
                        {p.paid ? <Icon name="check-circle" /> : <Icon name="x-circle" />}
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <p className="text-sm text-gray-500 text-center py-4">No players yet. Be the first to join!</p>
            )}
          </div>
        </div>
      )}

      {!isUp && !isTournament && !isOpenRegistration && (
        <div className="space-y-3">
          {match.costPerPlayer && (
            <div className="p-2 bg-yellow-50 border border-yellow-200 rounded text-center">
              <span className="text-sm font-semibold text-yellow-900">£{match.costPerPlayer.toFixed(2)} per player</span>
            </div>
          )}
          
          <div className="grid grid-cols-2 gap-2">
            {(match.players || []).map(p => {
              const playerInfo = players.find(pl => pl.id === p.id);
              const canPay = isAdmin || userPlayer?.id === p.id;
              const isOrganizer = p.id === match.paymentOrganizer;
              
              return (
                <div key={p.id} className={`border-2 rounded-lg p-2 ${isOrganizer ? 'border-green-500 bg-green-50' : 'border-gray-200'}`}>
                  <div onClick={() => canPay && onTogglePayment(match.id, p.id)}
                    className={`flex items-center justify-between p-1 rounded ${canPay ? 'cursor-pointer hover:bg-gray-50' : 'opacity-50'}`}>
                    <div>
                      <span className="text-sm font-medium">{p.name}</span>
                      {isOrganizer && <span className="ml-1 text-xs text-green-700">💰 Paid court</span>}
                    </div>
                    {p.paid ? <Icon name="check-circle" /> : <Icon name="x-circle" />}
                  </div>
                  
                  {!p.paid && !isOrganizer && playerInfo && (userPlayer?.id === p.id || isAdmin) && (
                    <div className="mt-2 pt-2 border-t">
                      {match.paymentOrganizer && (() => {
                        const organizer = players.find(pl => pl.id === match.paymentOrganizer);
                        return organizer ? (
                          <div className="space-y-2">
                            <div className="text-xs text-gray-600">
                              Pay <strong>{organizer.name}</strong>:
                            </div>
                            <div className="flex gap-1 flex-wrap">
                              {organizer.paypalLink && (
                                <a href={organizer.paypalLink} target="_blank" rel="noopener noreferrer"
                                  className="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                                  PayPal
                                </a>
                              )}
                              {organizer.revolutLink && (
                                <a href={organizer.revolutLink} target="_blank" rel="noopener noreferrer"
                                  className="text-xs px-2 py-1 bg-purple-100 text-purple-700 rounded hover:bg-purple-200">
                                  Revolut
                                </a>
                              )}
                              {(organizer.sortCode || organizer.accountNumber) && (
                                <button 
                                  onClick={() => { 
                                    const bankDetails = `Sort Code: ${organizer.sortCode || 'N/A'}\nAccount: ${organizer.accountNumber || 'N/A'}`;
                                    navigator.clipboard.writeText(bankDetails); 
                                    alert('Bank details copied!\n' + bankDetails); 
                                  }}
                                  className="text-xs px-2 py-1 bg-green-100 text-green-700 rounded hover:bg-green-200">
                                  Bank
                                </button>
                              )}
                            </div>
                          </div>
                        ) : null;
                      })()}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {isTournament && !match.tournamentStarted && canEdit && (
        <>
          {/* Show player count for open registration tournaments */}
          {isOpenRegistration && (
            <div className="mt-3 p-3 bg-blue-50 border border-blue-200 rounded-lg text-center">
              <div className="text-sm text-blue-800">
                <strong>{match.players?.length || 0}</strong> players registered
              </div>
              <div className="text-xs text-blue-600 mt-1">
                Need at least 4 players to start tournament
              </div>
            </div>
          )}
          
          {/* Start Tournament button - requires minimum 4 players */}
          {(!isOpenRegistration || (match.players && match.players.length >= 4)) && (
            <button onClick={() => onStartTournament(match)}
              className="w-full mt-3 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center justify-center gap-2">
              <Icon name="trophy" />
              Start Tournament
            </button>
          )}
          
          {/* Show message if not enough players for open registration tournament */}
          {isOpenRegistration && match.players && match.players.length < 4 && (
            <div className="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg text-center text-sm text-amber-800">
              ⚠️ Need at least 4 players to start tournament ({match.players.length}/4)
            </div>
          )}
        </>
      )}

      {/* Score Display for Open Matches */}
      {!isTournament && match.matchScores && match.matchScores.some(s => s.team1 || s.team2) && (
        <div className="mt-3 pt-3 border-t">
          <h4 className="text-sm font-semibold mb-2">Match Result</h4>
          <div className="flex gap-2 justify-center">
            {match.matchScores.map((set, idx) => (
              <div key={idx} className="text-center">
                <div className="text-xs text-gray-500 mb-1">Set {idx + 1}</div>
                <div className="font-bold">
                  {set.team1 || '-'} - {set.team2 || '-'}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Score Input Modal */}
      {showScoreInput && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-md w-full">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-bold">Input Match Scores</h3>
              <button onClick={() => setShowScoreInput(false)} className="text-gray-400 hover:text-gray-600">
                <Icon name="x" />
              </button>
            </div>

            <div className="space-y-4">
              {matchScores.map((set, idx) => (
                <div key={idx} className="border rounded-lg p-3">
                  <div className="text-sm font-semibold mb-2">Set {idx + 1}</div>
                  <div className="flex items-center gap-3">
                    <div className="flex-1">
                      <label className="block text-xs text-gray-600 mb-1">Team 1</label>
                      <input
                        type="number"
                        min="0"
                        max="7"
                        value={set.team1}
                        onChange={(e) => {
                          const newScores = [...matchScores];
                          newScores[idx].team1 = e.target.value;
                          setMatchScores(newScores);
                        }}
                        className="w-full px-3 py-2 border rounded-lg text-center font-bold"
                        placeholder="0"
                      />
                    </div>
                    <span className="text-gray-400 mt-5">-</span>
                    <div className="flex-1">
                      <label className="block text-xs text-gray-600 mb-1">Team 2</label>
                      <input
                        type="number"
                        min="0"
                        max="7"
                        value={set.team2}
                        onChange={(e) => {
                          const newScores = [...matchScores];
                          newScores[idx].team2 = e.target.value;
                          setMatchScores(newScores);

                        className="w-full px-3 py-2 border rounded-lg text-center font-bold"
                        placeholder="0"
                      />

            <div className="flex gap-2 mt-6">
              <button 
                onClick={saveMatchScores}
                className="flex-1 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">
                Save Scores
              </button>
              <button 
                onClick={() => setShowScoreInput(false)}
                className="flex-1 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Time Input Modal */}
      {showTimeModal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg p-6 max-w-sm w-full">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-bold">Set Match Time</h3>
              <button onClick={() => setShowTimeModal(false)} className="text-gray-400 hover:text-gray-600">
                <Icon name="x" />
              </button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="block text-sm font-medium mb-1">Start Time</label>
                <input 
                  type="time" 
                  value={startTime}
                  onChange={(e) => setStartTime(e.target.value)}
                  className="w-full px-3 py-2 border rounded-lg"

              </div>
              <div>
                <label className="block text-sm font-medium mb-1">End Time</label>
                <input 
                  type="time" 
                  value={endTime}
                  onChange={(e) => setEndTime(e.target.value)}
                  className="w-full px-3 py-2 border rounded-lg"
                />
              </div>
            </div>

            <div className="flex gap-2 mt-6">
              <button 
                onClick={saveMatchTime}
                className="flex-1 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">
                Save Time
              </button>
              <button 
                onClick={() => setShowTimeModal(false)}

                Cancel

      {/* Admin Player Selection Modal */}
      {showAdminJoinModal && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

            <div className="space-y-2 max-h-96 overflow-y-auto">

}

function TournamentCard({ match, players, isAdmin, onUpdateScore, onCompleteRound, onDelete }) {
  const [selectedMatch, setSelectedMatch] = useState(null);
  const [showTimeModal, setShowTimeModal] = useState(false);
  const [timeModalMatch, setTimeModalMatch] = useState(null);
  const [startTime, setStartTime] = useState('');
  const [endTime, setEndTime] = useState('');
  
  const currentRound = match.tournamentRounds?.find(r => !r.completed);
  const currentRoundNumber = match.currentRoundNumber || 1;
  const totalRounds = match.format === 'americano' ? match.tournamentRounds?.length : '?';
  
  const sortedPlayers = [...(match.tournamentPlayers || [])].sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    return b.gamesWon - a.gamesWon;
  });

  const allRoundsComplete = match.tournamentRounds?.every(r => r.completed);

  const setQuickScore = (roundIdx, matchIdx, score1) => {
    const score2 = match.targetPoints - score1;
    onUpdateScore(match.id, roundIdx, matchIdx, 'team1', score1.toString());
    onUpdateScore(match.id, roundIdx, matchIdx, 'team2', score2.toString());
    setSelectedMatch(null);
  };

  const openTimeModal = (matchIdx) => {
    const m = currentRound.matches[matchIdx];
    setTimeModalMatch(matchIdx);
    setStartTime(m.startTime || '');
    setEndTime(m.endTime || '');
    setShowTimeModal(true);
  };

  const saveMatchTime = async () => {
    if (!startTime || !endTime) {
      alert('Please enter both start and end times');
      return;
    }
    
    const newRounds = [...match.tournamentRounds];
    const roundIdx = currentRound.number - 1;
    newRounds[roundIdx].matches[timeModalMatch].startTime = startTime;
    newRounds[roundIdx].matches[timeModalMatch].endTime = endTime;
    
    await db.collection('matches').doc(match.id).update({
      tournamentRounds: newRounds
    });
    
    setShowTimeModal(false);
    setStartTime('');
    setEndTime('');
    setTimeModalMatch(null);
  };

  return (
    <div className="bg-white rounded-lg shadow-sm overflow-hidden">
      {/* Header */}
      <div className="bg-indigo-600 text-white p-4">
        <div className="flex justify-between items-start">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <h3 className="text-lg font-bold">{match.format === 'americano' ? 'Americano' : 'Mexicano'}</h3>
              {match.targetPoints && (
                <span className="px-2 py-1 bg-white bg-opacity-20 rounded text-sm">{match.targetPoints}pts</span>
              )}
            </div>
            <p className="text-sm opacity-90">{new Date(match.date).toLocaleDateString('en-GB')}</p>
            {match.location && <p className="text-xs opacity-75">📍 {match.location}</p>}
          </div>
          {isAdmin && (
            <button onClick={() => onDelete(match.id)} className="text-white opacity-75 hover:opacity-100">
              <Icon name="trash-2" />
            </button>
          )}
        </div>
        
        {!allRoundsComplete && (
          <div className="mt-3 bg-white bg-opacity-20 rounded p-2 text-sm">
            <div className="flex justify-between items-center">
              <span>Round {currentRoundNumber} of {totalRounds}</span>
              <span>{match.courts} Court{match.courts > 1 ? 's' : ''}</span>
            </div>
          </div>
        )}
      </div>

      {/* Leaderboard */}
      <div className="p-4 border-b">
        <h4 className="font-semibold mb-3">Leaderboard</h4>
        <div className="space-y-2">
          {sortedPlayers.map((p, idx) => {
            const isWinner = match.targetPoints && p.points >= match.targetPoints;
            return (
              <div key={p.id} className={`flex items-center justify-between p-2 rounded ${
                isWinner ? 'bg-yellow-100 border-2 border-yellow-400' : 'bg-gray-50'
              }`}>
                <div className="flex items-center gap-3">
                  <span className="font-bold text-gray-400 w-6">#{idx + 1}</span>
                  <span className="font-medium">{p.name}</span>
                  {isWinner && <span>👑</span>}
                </div>
                <div className="text-right">
                  <div className="font-bold text-indigo-600">{p.points}</div>
                  <div className="text-xs text-gray-500">{p.gamesWon}W</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Current Round */}
      {currentRound && !allRoundsComplete && (
        <div className="p-4">
          <div className="flex justify-between items-center mb-3">
            <h4 className="font-semibold">Round {currentRound.number}</h4>
          </div>
          
          <div className="space-y-3">
            {currentRound.matches.map((m, idx) => {
              const team1Names = m.team1.map(id => players.find(p => p.id === id)?.name || '?');
              const team2Names = m.team2.map(id => players.find(p => p.id === id)?.name || '?');
              const hasScores = m.score.team1 && m.score.team2;
              const showQuickPicker = isAdmin && selectedMatch === idx;
              
              return (
                <div key={idx} className="border-2 border-gray-200 rounded-lg p-3">
                  <div className="flex justify-between items-center mb-2">
                    <div className="text-xs text-gray-500 font-semibold">Court {m.court}</div>
                    {m.startTime && m.endTime && (
                      <div className="text-xs text-gray-500">
                        {m.startTime} - {m.endTime}
                      </div>
                    )}
                    {isAdmin && !hasScores && (
                      <button 
                        onClick={() => openTimeModal(idx)}
                        className="text-xs text-indigo-600 hover:text-indigo-800">
                        ⏱️ Set Time
                      </button>
                    )}
                  </div>
                  
                  <div className="grid grid-cols-[1fr,auto,1fr] gap-2 items-center mb-3">
                    <div className="text-right">
                      <div className="font-medium text-sm">{team1Names[0]}</div>
                      <div className="text-xs text-gray-600">{team1Names[1]}</div>
                    </div>
                    
                    <div className="flex gap-2">
                      {hasScores ? (
                        <>
                          <div className="w-12 text-center border-2 border-gray-300 rounded font-bold text-lg p-1 bg-gray-50">
                            {m.score.team1}
                          </div>
                          <span className="text-gray-400">-</span>
                          <div className="w-12 text-center border-2 border-gray-300 rounded font-bold text-lg p-1 bg-gray-50">
                            {m.score.team2}
                          </div>
                        </>
                      ) : isAdmin ? (
                        <>
                          <button
                            onClick={() => setSelectedMatch(showQuickPicker ? null : idx)}
                            className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-semibold">
                            Input Score
                          </button>
                        </>
                      ) : (
                        <div className="text-gray-400 text-sm">Awaiting score</div>
                      )}
                    </div>
                    
                    <div>
                      <div className="font-medium text-sm">{team2Names[0]}</div>
                      <div className="text-xs text-gray-600">{team2Names[1]}</div>
                    </div>
                  </div>

                  {showQuickPicker && (
                    <div className="mt-3 pt-3 border-t">
                      <div className="text-xs text-gray-600 mb-2 text-center">
                        Select {team1Names[0]} & {team1Names[1]}'s score:
                      </div>
                      <div className="flex flex-wrap gap-2 justify-center">
                        {Array.from({ length: match.targetPoints + 1 }, (_, i) => i).map(score => (
                          <button
                            key={score}
                            onClick={() => setQuickScore(currentRound.number - 1, idx, score)}
                            className={`w-12 h-12 rounded-lg font-bold text-sm ${
                              score > match.targetPoints / 2 
                                ? 'bg-green-600 text-white hover:bg-green-700' 
                                : 'bg-gray-600 text-white hover:bg-gray-700'
                            }`}>
                            {score}
                          </button>
                        ))}
                        <button
                          onClick={() => setSelectedMatch(null)}
                          className="w-12 h-12 rounded-lg font-bold text-sm bg-red-600 text-white hover:bg-red-700">
                          ✕
                        </button>
                      </div>
                      <div className="text-xs text-center mt-2 text-gray-500">
                        Opponent will get {match.targetPoints} - [your score]
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {showTimeModal && timeModalMatch !== null && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-lg p-6 max-w-sm w-full">
                <h3 className="font-bold mb-4">Set Match Time</h3>
                <div className="space-y-3">
                  <div>
                    <label className="block text-sm font-medium mb-1">Start Time</label>
                    <input 
                      type="time" 
                      value={startTime}
                      onChange={(e) => setStartTime(e.target.value)}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium mb-1">End Time</label>
                    <input 
                      type="time" 
                      value={endTime}
                      onChange={(e) => setEndTime(e.target.value)}
                      className="w-full px-3 py-2 border rounded-lg"
                    />
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={saveMatchTime}
                      className="flex-1 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                      Save
                    </button>
                    <button 
                      onClick={() => {
                        setShowTimeModal(false);
                        setStartTime('');
                        setEndTime('');
                        setTimeModalMatch(null);
                      }}
                      className="flex-1 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {isAdmin && (
            <button 
              onClick={() => onCompleteRound(match.id, currentRound.number - 1)}
              className="w-full mt-4 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700">
              Complete Round {currentRound.number}
            </button>
          )}
        </div>
      )}

      {allRoundsComplete && (
        <div className="p-4 bg-green-50 border-t-4 border-green-400 text-center">
          <div className="text-4xl mb-2">🏆</div>
          <div className="font-bold text-green-800 text-lg">Tournament Complete!</div>
          <div className="text-green-600">Winner: {sortedPlayers[0]?.name} ({sortedPlayers[0]?.points} pts)</div>
        </div>
      )}
    </div>
  );
}

              value={newMatch.maxPlayers} 
              onChange={(e) => setNewMatch({ ...newMatch, maxPlayers: parseInt(e.target.value) || 4 })}
              className="w-full px-3 py-2 border rounded-lg text-sm" 
            />
          </div>
        )}

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium mb-1">Courts</label>
            <input type="number" min="1" value={newMatch.courts} 
              onChange={(e) => setNewMatch({ ...newMatch, courts: parseInt(e.target.value) || 1 })}
              className="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
          <div>
            <label className="block text-sm font-medium mb-1">Total Court Fee (£)</label>
            <input type="number" step="0.01" value={newMatch.courtFee}
              onChange={(e) => setNewMatch({ ...newMatch, courtFee: e.target.value })}
              className="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
        </div>

        {newMatch.courtFee && newMatch.selectedPlayers.length > 0 && (
          <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg">
            <div className="text-sm font-semibold text-blue-900">Cost per player: £{costPerPlayer}</div>
            <div className="text-xs text-blue-700">£{newMatch.courtFee} ÷ {newMatch.selectedPlayers.length} players</div>
          </div>
        )}

        <div>
          <label className="block text-sm font-medium mb-1">Location</label>
          <select value={newMatch.location} 
            onChange={(e) => setNewMatch({ ...newMatch, location: e.target.value })}
            className="w-full px-3 py-2 border rounded-lg text-sm">
            <option value="">Select location...</option>
            {locations.map(loc => <option key={loc} value={loc}>{loc}</option>)}
          </select>
        </div>

        {!newMatch.openRegistration && (
          <>
            <div>
              <label className="block text-sm font-medium mb-2">
                Players ({newMatch.selectedPlayers.length} selected)
              </label>
              <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto">
                {players.map(p => (
                  <button key={p.id}
                    onClick={() => {
                      const selected = newMatch.selectedPlayers.includes(p.id);
                      setNewMatch({
                        ...newMatch,
                        selectedPlayers: selected 
                          ? newMatch.selectedPlayers.filter(id => id !== p.id)
                          : [...newMatch.selectedPlayers, p.id],
                        // Clear payment organizer if they're deselected
                        paymentOrganizer: selected && newMatch.paymentOrganizer === p.id ? null : newMatch.paymentOrganizer
                      });
                    }}
                    className={`p-2 text-xs rounded-lg border-2 ${
                      newMatch.selectedPlayers.includes(p.id) 
                        ? 'border-indigo-500 bg-indigo-50' 
                        : 'border-gray-200'
                    }`}>
                    {p.name}
                  </button>
                ))}
              </div>
            </div>

            {newMatch.selectedPlayers.length >= 4 && newMatch.courtFee && (
              <div>
                <label className="block text-sm font-medium mb-2">
                  Who paid for the court? (Others will pay them £{costPerPlayer})
                </label>
                <div className="grid grid-cols-2 gap-2">
                  {newMatch.selectedPlayers.map(playerId => {
                    const player = players.find(p => p.id === playerId);
                    return (
                      <button
                        key={playerId}
                        onClick={() => setNewMatch({ ...newMatch, paymentOrganizer: playerId })}
                        className={`p-3 rounded-lg border-2 text-sm ${
                          newMatch.paymentOrganizer === playerId
                            ? 'border-green-500 bg-green-50 font-semibold'
                            : 'border-gray-200 hover:border-gray-300'
                        }`}>
                        {player?.name}
                        {newMatch.paymentOrganizer === playerId && ' ✓'}
                      </button>
                    );
                  })}
                </div>
                <p className="text-xs text-gray-500 mt-2">
                  💡 This person will be marked as paid, and others will see their payment details
                </p>
              </div>
            )}
          </>
        )}

        <button onClick={onCreate}
          disabled={
            newMatch.openRegistration 
              ? !newMatch.courtFee
              : (newMatch.selectedPlayers.length < 4 || !newMatch.courtFee || !newMatch.paymentOrganizer)
          }
          className="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
          {newMatch.openRegistration ? 'Create & Get Link' : 'Create Match'}
        </button>
      </div>
    </div>
  );
}

function PlayersView({ players, isAdmin, showNewPlayer, setShowNewPlayer, playerForm, setPlayerForm, editingPlayer, setEditingPlayer, onAddPlayer, onUpdatePlayer }) {
  const deletePlayer = async (playerId, playerName) => {
    if (!confirm(`Are you sure you want to delete ${playerName}? This cannot be undone.`)) {
      return;
    }
    
    try {
      await db.collection('players').doc(playerId).delete();
    } catch (error) {
      alert('Failed to delete player: ' + error.message);
    }
  };

  return (
    <div className="space-y-4">
      {players.map(p => (
        <div key={p.id} className="bg-white rounded-lg shadow-sm p-4">
          <div className="flex justify-between items-start">
            <div className="flex-1">
              <h3 className="font-semibold">{p.name}</h3>
              {p.email && <p className="text-xs text-gray-500">📧 {p.email}</p>}
            </div>
            {isAdmin && (
              <div className="flex gap-2">
                <button onClick={() => {
                  setEditingPlayer(p.id);
                  setPlayerForm({
                    name: p.name,
                    paypalLink: p.paypalLink || '',
                    revolutLink: p.revolutLink || '',
                    sortCode: p.sortCode || '',
                    accountNumber: p.accountNumber || '',
                    email: p.email || ''
                  });
                }} className="text-indigo-600 hover:text-indigo-800">
                  <Icon name="edit" />
                </button>
                <button 
                  onClick={() => deletePlayer(p.id, p.name)}
                  className="text-red-600 hover:text-red-800">
                  <Icon name="trash-2" />
                </button>
              </div>
            )}
          </div>
        </div>
      ))}

      {isAdmin && (
        <button onClick={() => setShowNewPlayer(!showNewPlayer)}
          className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
          {showNewPlayer ? 'Cancel' : 'Add Player'}
        </button>
      )}

      {isAdmin && showNewPlayer && (
        <div className="bg-white rounded-lg shadow-sm p-4">
          <h3 className="font-semibold mb-4">New Player</h3>
          <div className="space-y-3">
            <input type="text" placeholder="Name" value={playerForm.name}
              onChange={(e) => setPlayerForm({ ...playerForm, name: e.target.value })}
              className="w-full px-3 py-2 border rounded-lg" />
            <input type="email" placeholder="Email (optional)" value={playerForm.email}
              onChange={(e) => setPlayerForm({ ...playerForm, email: e.target.value })}
              className="w-full px-3 py-2 border rounded-lg" />
            <input type="url" placeholder="PayPal Link" value={playerForm.paypalLink}
              onChange={(e) => setPlayerForm({ ...playerForm, paypalLink: e.target.value })}
              className="w-full px-3 py-2 border rounded-lg" />
            <input type="url" placeholder="Revolut Link" value={playerForm.revolutLink}
              onChange={(e) => setPlayerForm({ ...playerForm, revolutLink: e.target.value })}
              className="w-full px-3 py-2 border rounded-lg" />
            <div className="grid grid-cols-2 gap-2">
              <input type="text" placeholder="Sort Code (12-34-56)" value={playerForm.sortCode}
                onChange={(e) => setPlayerForm({ ...playerForm, sortCode: e.target.value })}
                className="w-full px-3 py-2 border rounded-lg" />
              <input type="text" placeholder="Account Number" value={playerForm.accountNumber}
                onChange={(e) => setPlayerForm({ ...playerForm, accountNumber: e.target.value })}
                className="w-full px-3 py-2 border rounded-lg" />
            </div>
            <button onClick={onAddPlayer} className="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
              Add Player
            </button>
          </div>
        </div>
      )}

      {editingPlayer && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 className="font-semibold mb-4">Edit Player</h3>
            <div className="space-y-3">
              <input type="text" placeholder="Name" value={playerForm.name}
                onChange={(e) => setPlayerForm({ ...playerForm, name: e.target.value })}
                className="w-full px-3 py-2 border rounded-lg" />
              <input type="email" placeholder="Email (optional)" value={playerForm.email}
                onChange={(e) => setPlayerForm({ ...playerForm, email: e.target.value })}
                className="w-full px-3 py-2 border rounded-lg" />
              <input type="url" placeholder="PayPal Link" value={playerForm.paypalLink}
                onChange={(e) => setPlayerForm({ ...playerForm, paypalLink: e.target.value })}
                className="w-full px-3 py-2 border rounded-lg" />
              <input type="url" placeholder="Revolut Link" value={playerForm.revolutLink}
                onChange={(e) => setPlayerForm({ ...playerForm, revolutLink: e.target.value })}
                className="w-full px-3 py-2 border rounded-lg" />
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="Sort Code (12-34-56)" value={playerForm.sortCode}
                  onChange={(e) => setPlayerForm({ ...playerForm, sortCode: e.target.value })}
                  className="w-full px-3 py-2 border rounded-lg" />
                <input type="text" placeholder="Account Number" value={playerForm.accountNumber}
                  onChange={(e) => setPlayerForm({ ...playerForm, accountNumber: e.target.value })}
                  className="w-full px-3 py-2 border rounded-lg" />
              </div>
              <div className="flex gap-2">
                <button onClick={onUpdatePlayer} className="flex-1 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                  Save
                </button>
                <button onClick={() => {
                  setEditingPlayer(null);
                  setPlayerForm({ name: '', paypalLink: '', revolutLink: '', sortCode: '', accountNumber: '', email: '' });
                }} className="flex-1 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
