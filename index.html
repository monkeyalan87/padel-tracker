<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Padel Tracker">
    <meta name="theme-color" content="#4F46E5">
    <title>Padel Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect } = React;

// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDog2f8jYrxm7J19h6QOtTUsuDgiNUmtSU",
  authDomain: "padel-tracker-uk.firebaseapp.com",
  projectId: "padel-tracker-uk",
  storageBucket: "padel-tracker-uk.firebasestorage.app",
  messagingSenderId: "557326239556",
  appId: "1:557326239556:web:4bb796309b0eac6697f911"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function Icon({ name }) {
  useEffect(() => { lucide.createIcons(); });
  return React.createElement('i', { 'data-lucide': name });
}

function App() {
  const [view, setView] = useState('matches');
  const [players, setPlayers] = useState([]);
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showNewMatch, setShowNewMatch] = useState(false);
  const [showNewPlayer, setShowNewPlayer] = useState(false);
  const [newPlayerName, setNewPlayerName] = useState('');
  const [editingPlayer, setEditingPlayer] = useState(null);
  const [playerForm, setPlayerForm] = useState({ name: '', paypalLink: '', revolutLink: '', bankDetails: '' });
  const [showPass, setShowPass] = useState(false);
  const [tempPass, setTempPass] = useState('');
  const [passAction, setPassAction] = useState(null);
  const [playerToDel, setPlayerToDel] = useState(null);
  const [isAuth, setIsAuth] = useState(false);
  const [newMatch, setNewMatch] = useState({
    date: new Date().toISOString().split('T')[0],
    time: '', courtFee: '', courts: 1, format: 'open', location: '', selectedPlayers: []
  });

  const locs = ['Wrexham Tennis Centre', 'Padel Shed Wrexham', 'Ace Padel Club @ Lion Quays', 'Padel at CNW Golf Academy'];

  // Load data from Firebase
  useEffect(() => {
    const unsubPlayers = db.collection('players').orderBy('name').onSnapshot(snapshot => {
      const playerData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      setPlayers(playerData);
      setLoading(false);
    });

    const unsubMatches = db.collection('matches').orderBy('date', 'desc').onSnapshot(snapshot => {
      const matchData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      setMatches(matchData);
    });

    return () => {
      unsubPlayers();
      unsubMatches();
    };
  }, []);

  useEffect(() => { lucide.createIcons(); });

  const checkPass = () => {
    if (tempPass === 'padel2025') {
      setIsAuth(true); setShowPass(false); setTempPass('');
      if (passAction === 'addPlayer') setShowNewPlayer(true);
      else if (passAction === 'editPlayer' && playerToDel) {
        const player = players.find(p => p.id === playerToDel);
        if (player) {
          setEditingPlayer(player.id);
          setPlayerForm({
            name: player.name || '',
            paypalLink: player.paypalLink || '',
            revolutLink: player.revolutLink || '',
            bankDetails: player.bankDetails || ''
          });
        }
        setPlayerToDel(null);
      }
      else if (passAction === 'deletePlayer' && playerToDel) {
        db.collection('players').doc(playerToDel).delete();
        setPlayerToDel(null);
      }
      setPassAction(null);
    } else {
      alert('Incorrect password');
      setTempPass('');
    }
  };

  const reqAuth = (action, pid = null) => {
    setPassAction(action);
    if (pid) setPlayerToDel(pid);
    setShowPass(true);
  };

  const addPlayer = async () => {
    if (playerForm.name.trim()) {
      await db.collection('players').add({
        name: playerForm.name.trim(),
        paypalLink: playerForm.paypalLink.trim(),
        revolutLink: playerForm.revolutLink.trim(),
        bankDetails: playerForm.bankDetails.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setPlayerForm({ name: '', paypalLink: '', revolutLink: '', bankDetails: '' });
      setShowNewPlayer(false); 
      setIsAuth(false);
    }
  };

  const updatePlayer = async () => {
    if (editingPlayer && playerForm.name.trim()) {
      await db.collection('players').doc(editingPlayer).update({
        name: playerForm.name.trim(),
        paypalLink: playerForm.paypalLink.trim(),
        revolutLink: playerForm.revolutLink.trim(),
        bankDetails: playerForm.bankDetails.trim()
      });
      setEditingPlayer(null);
      setPlayerForm({ name: '', paypalLink: '', revolutLink: '', bankDetails: '' });
      setIsAuth(false);
    }
  };

  const startEditPlayer = (player) => {
    if (isAuth) {
      setEditingPlayer(player.id);
      setPlayerForm({
        name: player.name || '',
        paypalLink: player.paypalLink || '',
        revolutLink: player.revolutLink || '',
        bankDetails: player.bankDetails || ''
      });
    } else {
      reqAuth('editPlayer', player.id);
    }
  };

  const createMatch = async () => {
    if (newMatch.selectedPlayers.length >= 4 && newMatch.courtFee) {
      await db.collection('matches').add({
        ...newMatch,
        courtFee: parseFloat(newMatch.courtFee),
        players: newMatch.selectedPlayers.map(id => {
          const player = players.find(p => p.id === id);
          return { id, name: player.name, paid: false };
        }),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      setNewMatch({
        date: new Date().toISOString().split('T')[0],
        time: '', courtFee: '', courts: 1, format: 'open', location: '', selectedPlayers: []
      });
      setShowNewMatch(false);
    }
  };

  const genICS = (m) => {
    const fmtDate = (d, t) => new Date(d + 'T' + (t || '00:00')).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const start = fmtDate(m.date, m.time);
    const end = new Date(m.date + 'T' + (m.time || '00:00'));
    end.setHours(end.getHours() + 2);
    const endFmt = end.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const fmt = m.format === 'open' ? 'Open Match' : m.format === 'americano' ? 'Americano' : 'Mexicano';
    const pList = m.players.map(p => p.name).join(', ');
    const loc = m.location || 'Padel Court';
    const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Padel//EN\nBEGIN:VEVENT\nUID:${m.id}@padel.com\nDTSTART:${start}\nDTEND:${endFmt}\nSUMMARY:Padel - ${fmt}\nDESCRIPTION:${pList}\\n£${m.courtFee.toFixed(2)}\nLOCATION:${loc}\nEND:VEVENT\nEND:VCALENDAR`;
    const blob = new Blob([ics], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `padel-${m.date}.ics`; a.click();
    URL.revokeObjectURL(url);
  };

  const togPlayer = (pid) => {
    const max = newMatch.courts * 4;
    if (newMatch.selectedPlayers.includes(pid)) {
      setNewMatch({ ...newMatch, selectedPlayers: newMatch.selectedPlayers.filter(id => id !== pid) });
    } else if (newMatch.selectedPlayers.length < max) {
      setNewMatch({ ...newMatch, selectedPlayers: [...newMatch.selectedPlayers, pid] });
    }
  };

  const togPay = async (matchId, playerId) => {
    const match = matches.find(m => m.id === matchId);
    const updatedPlayers = match.players.map(p => 
      p.id === playerId ? { ...p, paid: !p.paid } : p
    );
    await db.collection('matches').doc(matchId).update({ players: updatedPlayers });
  };

  const deleteMatch = async (matchId) => {
    await db.collection('matches').doc(matchId).delete();
  };

  const feePerPlayer = newMatch.courtFee && newMatch.selectedPlayers.length > 0 
    ? (parseFloat(newMatch.courtFee) / newMatch.selectedPlayers.length).toFixed(2) : '0.00';

  const totalRev = matches.reduce((s, m) => s + m.courtFee, 0);
  const totalCol = matches.reduce((s, m) => {
    const paid = m.players.filter(p => p.paid).length;
    return s + (m.courtFee / m.players.length) * paid;
  }, 0);

  if (loading) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center">
        <div className="text-center">
          <div className="text-6xl mb-4">🎾</div>
          <p className="text-lg text-gray-600">Loading Padel Tracker...</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
      <div className="bg-white shadow-sm border-b">
        <div className="max-w-2xl mx-auto px-4 py-4">
          <h1 className="text-2xl font-bold text-gray-900">Padel Tracker</h1>
          <p className="text-sm text-gray-600">Synced across all devices ☁️</p>
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-4">
        <div className="bg-white rounded-lg shadow-sm p-1 grid grid-cols-4 gap-1">
          {['matches', 'stats', 'admin', 'players'].map(tab => (
            <button key={tab} onClick={() => setView(tab)}
              className={`py-2 px-2 rounded-md text-xs font-medium ${view === tab ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-100'}`}>
              {tab.charAt(0).toUpperCase() + tab.slice(1)}
            </button>
          ))}
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 pb-24">
        {view === 'matches' && (
          <div className="space-y-4">
            {matches.length === 0 && !showNewMatch && (
              <div className="bg-white rounded-lg shadow-sm p-8 text-center">
                <div className="text-6xl mb-4">📅</div>
                <p className="text-gray-600">No matches yet</p>
                <p className="text-sm text-gray-500 mt-2">Create a match and it will sync to all devices!</p>
              </div>
            )}

            {matches.sort((a, b) => new Date(a.date + ' ' + (a.time || '00:00')) - new Date(b.date + ' ' + (b.time || '00:00'))).map(m => {
              const paidCnt = m.players.filter(p => p.paid).length;
              const allPaid = paidCnt === m.players.length;
              const mDate = new Date(m.date + ' ' + (m.time || '00:00'));
              const isUp = mDate >= new Date();
              
              return (
                <div key={m.id} className="bg-white rounded-lg shadow-sm p-4">
                  <div className="flex justify-between mb-3">
                    <div className="flex-1">
                      <div className="flex items-center gap-2 flex-wrap mb-1">
                        <h3 className="font-semibold">{m.courts} Court{m.courts > 1 ? 's' : ''}</h3>
                        <span className={`px-2 py-0.5 text-xs rounded-full ${
                          m.format === 'open' ? 'bg-blue-100 text-blue-700' :
                          m.format === 'americano' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'
                        }`}>{m.format === 'open' ? 'Open' : m.format === 'americano' ? 'Americano' : 'Mexicano'}</span>
                        {isUp && <span className="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded-full">Upcoming</span>}
                      </div>
                      <p className="text-sm text-gray-600">{new Date(m.date).toLocaleDateString('en-GB')} {m.time && `at ${m.time}`}</p>
                      {m.location && <p className="text-xs text-gray-500">📍 {m.location}</p>}
                      <p className="text-xs text-gray-500 mt-1">{m.players.map(p => p.name).join(', ')}</p>
                    </div>
                    <div className="flex flex-col gap-2">
                      <button onClick={() => genICS(m)} className="text-indigo-600 hover:text-indigo-700">
                        <Icon name="calendar" />
                      </button>
                      <button onClick={() => deleteMatch(m.id)} className="text-gray-400 hover:text-red-500">
                        <Icon name="trash-2" />
                      </button>
                    </div>
                  </div>

                  {!isUp && (
                    <>
                      <div className="mb-3 pb-3 border-b">
                        <div className="flex justify-between text-sm">
                          <span className="text-gray-600">Fee:</span>
                          <span className="font-semibold">£{m.courtFee.toFixed(2)}</span>
                        </div>
                        <div className="flex justify-between text-sm mt-1">
                          <span className="text-gray-600">Per Player:</span>
                          <span className="font-semibold text-indigo-600">£{(m.courtFee / m.players.length).toFixed(2)}</span>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        {m.players.map(p => {
                          const playerInfo = players.find(pl => pl.id === p.id);
                          return (
                            <div key={p.id} className="border rounded-lg p-2">
                              <div onClick={() => togPay(m.id, p.id)}
                                className="flex items-center justify-between cursor-pointer hover:bg-gray-50 rounded p-1">
                                <span className="text-sm">{p.name}</span>
                                {p.paid ? <Icon name="check-circle" /> : <Icon name="x-circle" />}
                              </div>
                              {!p.paid && playerInfo && (
                                <div className="mt-2 pt-2 border-t flex gap-1 flex-wrap">
                                  {playerInfo.paypalLink && (
                                    <a href={playerInfo.paypalLink} target="_blank" rel="noopener noreferrer"
                                      className="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                                      PayPal
                                    </a>
                                  )}
                                  {playerInfo.revolutLink && (
                                    <a href={playerInfo.revolutLink} target="_blank" rel="noopener noreferrer"
                                      className="text-xs px-2 py-1 bg-purple-100 text-purple-700 rounded hover:bg-purple-200">
                                      Revolut
                                    </a>
                                  )}
                                  {playerInfo.bankDetails && (
                                    <button onClick={() => {
                                      navigator.clipboard.writeText(playerInfo.bankDetails);
                                      alert('Bank details copied!');
                                    }} className="text-xs px-2 py-1 bg-green-100 text-green-700 rounded hover:bg-green-200">
                                      Bank
                                    </button>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              );
            })}

            {showNewMatch && (
              <div className="bg-white rounded-lg shadow-sm p-4">
                <h3 className="font-semibold mb-4">New Match</h3>
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-medium mb-1">Date</label>
                      <input type="date" value={newMatch.date} onChange={(e) => setNewMatch({ ...newMatch, date: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-1">Time</label>
                      <input type="time" value={newMatch.time} onChange={(e) => setNewMatch({ ...newMatch, time: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-2">Format</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['open', 'americano', 'mexicano'].map(f => (
                        <button key={f} onClick={() => setNewMatch({ ...newMatch, format: f })}
                          className={`p-2 rounded-lg border-2 text-xs ${newMatch.format === f ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200'}`}>
                          {f.charAt(0).toUpperCase() + f.slice(1)}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1">Location</label>
                    <select value={newMatch.location} onChange={(e) => setNewMatch({ ...newMatch, location: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg text-sm">
                      <option value="">Select location</option>
                      {locs.map(l => <option key={l} value={l}>{l}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1">Courts</label>
                    <select value={newMatch.courts} onChange={(e) => setNewMatch({ ...newMatch, courts: parseInt(e.target.value), selectedPlayers: [] })}
                      className="w-full px-3 py-2 border rounded-lg text-sm">
                      <option value="1">1 Court (4 players)</option>
                      <option value="2">2 Courts (8 players)</option>
                      <option value="3">3 Courts (12 players)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1">Fee (£)</label>
                    <input type="number" step="0.01" value={newMatch.courtFee}
                      onChange={(e) => setNewMatch({ ...newMatch, courtFee: e.target.value })}
                      placeholder="30.00"
                      className="w-full px-3 py-2 border rounded-lg text-sm" />
                    {newMatch.courtFee && newMatch.selectedPlayers.length > 0 && (
                      <p className="text-sm text-gray-600 mt-1">£{feePerPlayer} per player</p>
                    )}
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-2">Players ({newMatch.selectedPlayers.length}/{newMatch.courts * 4})</label>
                    <div className="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto">
                      {players.map(p => (
                        <button key={p.id} onClick={() => togPlayer(p.id)}
                          className={`p-2 rounded-lg border-2 text-xs ${newMatch.selectedPlayers.includes(p.id) ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200'}`}>
                          {p.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button onClick={createMatch} disabled={newMatch.selectedPlayers.length !== newMatch.courts * 4 || !newMatch.courtFee}
                      className="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 disabled:bg-gray-300 text-sm">
                      Create Match
                    </button>
                    <button onClick={() => setShowNewMatch(false)} className="px-4 py-2 border rounded-lg text-sm">Cancel</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {view === 'tournament' && (
          <div className="bg-white rounded-lg shadow-sm p-8 text-center">
            <div className="text-6xl mb-4">🏆</div>
            <p className="text-gray-600">Tournaments coming soon</p>
          </div>
        )}

        {view === 'tournament' && (
          <div className="bg-white rounded-lg shadow-sm p-8 text-center">
            <div className="text-6xl mb-4">🏆</div>
            <p className="text-gray-600">Tournaments coming soon</p>
          </div>
        )}

        {view === 'stats' && (
          <div className="bg-white rounded-lg shadow-sm p-8 text-center">
            <div className="text-6xl mb-4">📊</div>
            <p className="text-gray-600">Stats coming soon</p>
          </div>
        )}

        {view === 'admin' && (
          <div className="bg-white rounded-lg shadow-sm p-4">
            <h3 className="font-semibold mb-4 flex items-center gap-2">
              <span className="text-lg">💷</span> Outstanding Debts
            </h3>
            {totalRev === 0 || totalRev - totalCol === 0 ? (
              <div className="text-center py-8">
                <div className="text-6xl mb-4">💷</div>
                <p className="text-gray-600">All paid up!</p>
              </div>
            ) : (
              <div className="space-y-2">
                {matches.filter(m => m.players.some(p => !p.paid)).map(m => (
                  <div key={m.id} className="border rounded-lg p-3">
                    <div className="font-medium">{new Date(m.date).toLocaleDateString('en-GB')}</div>
                    {m.players.filter(p => !p.paid).map(p => (
                      <div key={p.id} className="flex justify-between text-sm mt-1">
                        <span>{p.name}</span>
                        <span className="text-red-600 font-medium">£{(m.courtFee / m.players.length).toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {view === 'players' && (
          <div className="space-y-4">
            {players.map(p => (
              <div key={p.id} className="bg-white rounded-lg shadow-sm p-4">
                {editingPlayer === p.id ? (
                  <div className="space-y-3">
                    <h3 className="font-semibold mb-2">Edit Player</h3>
                    <input type="text" value={playerForm.name} onChange={(e) => setPlayerForm({ ...playerForm, name: e.target.value })}
                      placeholder="Player name" className="w-full px-3 py-2 border rounded-lg text-sm" />
                    <input type="url" value={playerForm.paypalLink} onChange={(e) => setPlayerForm({ ...playerForm, paypalLink: e.target.value })}
                      placeholder="PayPal link (optional)" className="w-full px-3 py-2 border rounded-lg text-sm" />
                    <input type="url" value={playerForm.revolutLink} onChange={(e) => setPlayerForm({ ...playerForm, revolutLink: e.target.value })}
                      placeholder="Revolut link (optional)" className="w-full px-3 py-2 border rounded-lg text-sm" />
                    <textarea value={playerForm.bankDetails} onChange={(e) => setPlayerForm({ ...playerForm, bankDetails: e.target.value })}
                      placeholder="Bank details (optional)" className="w-full px-3 py-2 border rounded-lg text-sm" rows="2" />
                    <div className="flex gap-2">
                      <button onClick={updatePlayer} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm">Save</button>
                      <button onClick={() => { setEditingPlayer(null); setPlayerForm({ name: '', paypalLink: '', revolutLink: '', bankDetails: '' }); setIsAuth(false); }}
                        className="px-4 py-2 border rounded-lg text-sm">Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3 flex-1">
                      <div className="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
                        <span className="text-indigo-700 font-semibold text-lg">{p.name.charAt(0)}</span>
                      </div>
                      <div className="flex-1">
                        <div className="font-semibold">{p.name}</div>
                        <div className="flex gap-2 mt-1">
                          {p.paypalLink && <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">PayPal</span>}
                          {p.revolutLink && <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded">Revolut</span>}
                          {p.bankDetails && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">Bank</span>}
                        </div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => startEditPlayer(p)} className="text-gray-400 hover:text-indigo-500">
                        <Icon name="edit-2" />
                      </button>
                      <button onClick={() => {
                        if (isAuth) { 
                          db.collection('players').doc(p.id).delete(); 
                          setIsAuth(false); 
                        } else reqAuth('deletePlayer', p.id);
                      }} className="text-gray-400 hover:text-red-500">
                        <Icon name="trash-2" />
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ))}

            {showNewPlayer && isAuth && (
              <div className="bg-white rounded-lg shadow-sm p-4">
                <h3 className="font-semibold mb-3">Add Player</h3>
                <div className="space-y-3">
                  <input type="text" value={playerForm.name} onChange={(e) => setPlayerForm({ ...playerForm, name: e.target.value })}
                    placeholder="Player name" className="w-full px-3 py-2 border rounded-lg text-sm"
                    onKeyPress={(e) => e.key === 'Enter' && playerForm.name && addPlayer()} />
                  <input type="url" value={playerForm.paypalLink} onChange={(e) => setPlayerForm({ ...playerForm, paypalLink: e.target.value })}
                    placeholder="PayPal link (optional)" className="w-full px-3 py-2 border rounded-lg text-sm" />
                  <input type="url" value={playerForm.revolutLink} onChange={(e) => setPlayerForm({ ...playerForm, revolutLink: e.target.value })}
                    placeholder="Revolut link (optional)" className="w-full px-3 py-2 border rounded-lg text-sm" />
                  <textarea value={playerForm.bankDetails} onChange={(e) => setPlayerForm({ ...playerForm, bankDetails: e.target.value })}
                    placeholder="Bank details (optional)" className="w-full px-3 py-2 border rounded-lg text-sm" rows="2" />
                </div>
                <div className="flex gap-2 mt-3">
                  <button onClick={addPlayer} disabled={!playerForm.name.trim()} 
                    className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm disabled:bg-gray-300">Add Player</button>
                  <button onClick={() => { setShowNewPlayer(false); setPlayerForm({ name: '', paypalLink: '', revolutLink: '', bankDetails: '' }); setIsAuth(false); }}
                    className="px-4 py-2 border rounded-lg text-sm">Cancel</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="fixed bottom-6 right-6">
        <button onClick={() => {
          if (view === 'matches') setShowNewMatch(!showNewMatch);
          else if (view === 'players') {
            if (isAuth) setShowNewPlayer(!showNewPlayer);
            else reqAuth('addPlayer');
          }
        }} className={`w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 flex items-center justify-center ${
          view === 'stats' || view === 'admin' ? 'hidden' : ''
        }`}>
          <Icon name="plus" />
        </button>
      </div>

      {showPass && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full">
            <h3 className="text-lg font-semibold mb-4">Admin Password</h3>
            <p className="text-sm text-gray-600 mb-4">Enter password to manage players</p>
            <input type="password" value={tempPass} onChange={(e) => setTempPass(e.target.value)}
              placeholder="Password" className="w-full px-3 py-2 border rounded-lg mb-4 text-sm"
              onKeyPress={(e) => e.key === 'Enter' && checkPass()} autoFocus />
            <div className="flex gap-2">
              <button onClick={checkPass} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm">Confirm</button>
              <button onClick={() => { setShowPass(false); setTempPass(''); setPassAction(null); setPlayerToDel(null); }}
                className="px-4 py-2 border rounded-lg text-sm">Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
