<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #EFF6FF, #E0E7FF);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #4F46E5;
            margin-bottom: 20px;
        }
        .status {
            background: #10B981;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #4338CA;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎾 Padel Tracker Test</h1>
        <p>If you can see this page with colors and styling, GitHub Pages is working correctly!</p>
        <div class="status">✓ GitHub Pages is Live</div>
        <button onclick="alert('JavaScript is working!')">Test JavaScript</button>
        <p style="margin-top: 30px; font-size: 14px; color: #666;">
            Next step: Replace this test file with the full Padel Tracker app
        </p>
    </div>
</body>
</html>
