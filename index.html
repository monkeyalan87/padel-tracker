// Tournament Pairing Algorithms
function generateAmericanoPairings(playerIds, numCourts) {
  const n = playerIds.length;
  if (n < 4 || n % 2 !== 0) return null;
  
  const rounds = [];
  const numRounds = n - 1;
  const players = [...playerIds];
  
  for (let round = 0; round < numRounds; round++) {
    const roundMatches = [];
    const matchesPerRound = Math.floor(n / 4);
    
    for (let i = 0; i < matchesPerRound; i++) {
      const team1Player1 = players[i * 2];
      const team1Player2 = players[n - 1 - (i * 2)];
      const team2Player1 = players[i * 2 + 1];
      const team2Player2 = players[n - 2 - (i * 2)];
      
      roundMatches.push({
        court: (i % numCourts) + 1,
        team1: [team1Player1, team1Player2],
        team2: [team2Player1, team2Player2],
        score: { team1: '', team2: '' }
      });
    }
    
    rounds.push({ number: round + 1, matches: roundMatches, completed: false });
    
    const lastPlayer = players.pop();
    players.splice(1, 0, lastPlayer);
  }
  
  return rounds;
}

function generateMexicanoRound(playerIds, numCourts, currentStandings = null) {
  const n = playerIds.length;
  if (n < 4 || n % 2 !== 0) return null;
  
  let orderedPlayers;
  
  if (!currentStandings) {
    orderedPlayers = [...playerIds].sort(() => Math.random() - 0.5);
  } else {
    orderedPlayers = [...currentStandings].sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      return b.gamesWon - a.gamesWon;
    }).map(p => p.id);
  }
  
  const roundMatches = [];
  const matchesPerRound = Math.floor(n / 4);
  
  for (let i = 0; i < matchesPerRound; i++) {
    const baseIdx = i * 4;
    roundMatches.push({
      court: (i % numCourts) + 1,
      team1: [orderedPlayers[baseIdx], orderedPlayers[baseIdx + 3]],
      team2: [orderedPlayers[baseIdx + 1], orderedPlayers[baseIdx + 2]],
      score: { team1: '', team2: '' }
    });
  }
  
  return roundMatches;
}

  const filteredMatches = isAdmin ? matches : matches.filter(m =>

  );

  const addPlayer = async () => {

        email: playerForm.email.trim(),

      });

  };

  const updatePlayer = async () => {
    if (editingPlayer && playerForm.name.trim()) {
      await db.collection('players').doc(editingPlayer).update({
        name: playerForm.name.trim(),

      });

      setPlayerForm({ name: '', paypalLink: '', revolutLink: '', bankDetails: '', email: '' });
    }
  };

  const createMatch = async () => {
    if (newMatch.selectedPlayers.length >= 4 && newMatch.courtFee) {
      await db.collection('matches').add({
        ...newMatch,
        courtFee: parseFloat(newMatch.courtFee),
        players: newMatch.selectedPlayers.map(id => {
          const player = players.find(p => p.id === id);
          return { id, name: player.name, paid: false };
        }),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      setNewMatch({
        date: new Date().toISOString().split('T')[0],
        time: '', courtFee: '', courts: 1, format: 'open', location: '', selectedPlayers: []
      });
      setShowNewMatch(false);
    }
  };

  const togglePayment = async (matchId, playerId) => {
    if (!isAdmin && userPlayer?.id !== playerId) {
      alert('You can only mark yourself as paid');
      return;
    }
    
    const match = matches.find(m => m.id === matchId);
    const updatedPlayers = match.players.map(p => 
      p.id === playerId ? { ...p, paid: !p.paid } : p
    );
    await db.collection('matches').doc(matchId).update({ players: updatedPlayers });
  };

  const deleteMatch = async (matchId) => {
    if (!isAdmin) {
      alert('Only admins can delete matches');
      return;
    }
    if (confirm('Are you sure you want to delete this match?')) {
      await db.collection('matches').doc(matchId).delete();
    }
  };

  const showTournamentPointsDialog = (match) => {
    setPendingTournament(match);
    setShowPointsModal(true);
  };

  const startTournamentWithPoints = async (targetPoints) => {
    if (!pendingTournament) return;
    
    const match = pendingTournament;
    const playerIds = match.players.map(p => p.id);
    
    let rounds;
    if (match.format === 'americano') {
      rounds = generateAmericanoPairings(playerIds, match.courts);
    } else {
      // Mexicano - generate first round
      const firstRound = generateMexicanoRound(playerIds, match.courts, null);
      rounds = [{ number: 1, matches: firstRound, completed: false }];
    }

    if (!rounds) {
      alert('Invalid number of players. Need even number (minimum 4)');
      return;
    }

    await db.collection('matches').doc(match.id).update({
      tournamentStarted: true,
      tournamentRounds: rounds,
      tournamentPlayers: match.players.map(p => ({ ...p, points: 0, gamesWon: 0 })),
      targetPoints: targetPoints,
      currentRound: 1
    });
    
    setShowPointsModal(false);
    setPendingTournament(null);
  };

  const calculatePlayerPoints = (rounds) => {
    const playerPoints = {};
    
    rounds.forEach(round => {
      if (!round.completed) return;
      
      round.matches.forEach(m => {
        const s1 = parseInt(m.score.team1) || 0;
        const s2 = parseInt(m.score.team2) || 0;
        
        m.team1.forEach(pid => {
          if (!playerPoints[pid]) playerPoints[pid] = { points: 0, gamesWon: 0 };
          playerPoints[pid].points += s1;
          if (s1 > s2) playerPoints[pid].gamesWon++;
        });
        
        m.team2.forEach(pid => {
          if (!playerPoints[pid]) playerPoints[pid] = { points: 0, gamesWon: 0 };
          playerPoints[pid].points += s2;
          if (s2 > s1) playerPoints[pid].gamesWon++;
        });
      });
    });
    
    return playerPoints;
  };

  const saveRoundScores = async (matchId, roundIndex) => {
    const match = matches.find(m => m.id === matchId);
    if (!match) return;

    const newRounds = [...match.tournamentRounds];
    newRounds[roundIndex].completed = true;

    const playerPoints = calculatePlayerPoints(newRounds);
    const updatedPlayers = match.tournamentPlayers.map(p => ({
      ...p,
      points: playerPoints[p.id]?.points || 0,
      gamesWon: playerPoints[p.id]?.gamesWon || 0
    }));

    // For Mexicano, generate next round based on current standings
    if (match.format === 'mexicano' && roundIndex === match.currentRound - 1) {
      const nextRound = generateMexicanoRound(
        match.players.map(p => p.id),
        match.courts,
        updatedPlayers
      );
      
      if (nextRound) {
        newRounds.push({
          number: roundIndex + 2,
          matches: nextRound,
          completed: false
        });
      }
    }

    await db.collection('matches').doc(matchId).update({
      tournamentRounds: newRounds,
      tournamentPlayers: updatedPlayers,
      currentRound: match.currentRound + (match.format === 'mexicano' ? 1 : 0)
    });

    setShowScoreInput(null);
  };

  const totalRev = matches.reduce((s, m) => s + (m.courtFee || 0), 0);
  const totalCol = matches.reduce((s, m) => {
    const paid = (m.players || []).filter(p => p.paid).length;
    return s + ((m.courtFee || 0) / m.players.length) * paid;
  }, 0);

  if (loading) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center">

      </div>
    );

            <h3 className="text-xl font-bold mb-4">Select Target Points</h3>
            <p className="text-gray-600 mb-6">How many points should each match be played to?</p>
            
            <div className="space-y-3">
              <button 
                onClick={() => startTournamentWithPoints(16)}
                className="w-full py-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-lg">
                16 Points
                <span className="block text-sm font-normal opacity-90">(Shorter game)</span>
              </button>
              
              <button 
                onClick={() => startTournamentWithPoints(32)}
                className="w-full py-4 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-semibold text-lg">
                32 Points
                <span className="block text-sm font-normal opacity-90">(Standard game)</span>
              </button>

                  setShowPointsModal(false);
                  setPendingTournament(null);
                }}

            </div>
          </div>
        </div>
      )}

      {showScoreInput && (
        <ScoreInputModal 
          match={showScoreInput.match}
          roundIndex={showScoreInput.roundIndex}
          players={players}
          onSave={(matchId, roundIdx) => saveRoundScores(matchId, roundIdx)}

          <div>

            {filteredMatches.map(m => {
              const paidCnt = (m.players || []).filter(p => p.paid).length;
              const mDate = new Date(m.date + ' ' + (m.time || '00:00'));
              const isUp = mDate >= new Date();
              const isTournament = m.format === 'americano' || m.format === 'mexicano';
              const canEdit = isAdmin;
              
              return (
                <div key={m.id} className="bg-white rounded-lg shadow-sm p-4">
                  <div className="flex justify-between mb-3">
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        <h3 className="font-semibold">{m.courts} Court{m.courts > 1 ? 's' : ''}</h3>
                        <span className={`px-2 py-0.5 text-xs rounded-full ${
                          m.format === 'open' ? 'bg-blue-100 text-blue-700' :
                          m.format === 'americano' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'
                        }`}>{m.format === 'open' ? 'Open' : m.format === 'americano' ? 'Americano' : 'Mexicano'}</span>
                        {m.targetPoints && (
                          <span className="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-xs rounded-full">
                            {m.targetPoints}pts
                          </span>
                        )}
                        {isUp && <span className="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded-full">Upcoming</span>}
                      </div>
                      <p className="text-sm text-gray-600">{new Date(m.date).toLocaleDateString('en-GB')} {m.time && `at ${m.time}`}</p>
                      {m.location && <p className="text-xs text-gray-500">📍 {m.location}</p>}
                      <p className="text-xs text-gray-500 mt-1">{(m.players || []).map(p => p.name).join(', ')}</p>
                    </div>
                    {canEdit && (
                      <button onClick={() => deleteMatch(m.id)} className="text-gray-400 hover:text-red-500">
                        <Icon name="trash-2" />
                      </button>
                    )}
                  </div>

                  {!isUp && !isTournament && (
                    <div className="grid grid-cols-2 gap-2">
                      {(m.players || []).map(p => {
                        const playerInfo = players.find(pl => pl.id === p.id);
                        const canPay = isAdmin || userPlayer?.id === p.id;
                        return (
                          <div key={p.id} className="border rounded-lg p-2">
                            <div onClick={() => canPay && togglePayment(m.id, p.id)}
                              className={`flex items-center justify-between p-1 rounded ${canPay ? 'cursor-pointer hover:bg-gray-50' : 'opacity-50'}`}>
                              <span className="text-sm">{p.name}</span>
                              {p.paid ? <Icon name="check-circle" /> : <Icon name="x-circle" />}
                            </div>
                            {!p.paid && playerInfo && userPlayer?.id === p.id && (
                              <div className="mt-2 pt-2 border-t flex gap-1 flex-wrap">
                                {playerInfo.paypalLink && (
                                  <a href={playerInfo.paypalLink} target="_blank" rel="noopener noreferrer"

                                )}
                                {playerInfo.revolutLink && (
                                  <a href={playerInfo.revolutLink} target="_blank" rel="noopener noreferrer"
                                    className="text-xs px-2 py-1 bg-purple-100 text-purple-700 rounded">Revolut</a>
                                )}
                                {playerInfo.bankDetails && (
                                  <button onClick={() => { navigator.clipboard.writeText(playerInfo.bankDetails); alert('Copied!'); }}
                                    className="text-xs px-2 py-1 bg-green-100 text-green-700 rounded">Bank</button>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {!isUp && isTournament && !m.tournamentStarted && (
                    <div className="grid grid-cols-2 gap-2 mb-3">
                      {(m.players || []).map(p => {
                        const playerInfo = players.find(pl => pl.id === p.id);
                        const canPay = isAdmin || userPlayer?.id === p.id;
                        return (
                          <div key={p.id} className="border rounded-lg p-2">
                            <div onClick={() => canPay && togglePayment(m.id, p.id)}
                              className={`flex items-center justify-between p-1 rounded ${canPay ? 'cursor-pointer hover:bg-gray-50' : 'opacity-50'}`}>
                              <span className="text-sm">{p.name}</span>
                              {p.paid ? <Icon name="check-circle" /> : <Icon name="x-circle" />}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {isTournament && !m.tournamentStarted && canEdit && (
                    <button onClick={() => showTournamentPointsDialog(m)}
                      className="w-full mt-3 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 flex items-center justify-center gap-2">
                      <Icon name="trophy" />
                      Start Tournament
                    </button>
                  )}

                  {m.tournamentStarted && m.tournamentRounds && (
                    <TournamentView 
                      match={m}
                      players={players}
                      isAdmin={canEdit}
                      onInputScores={(match, roundIdx) => setShowScoreInput({ match, roundIndex: roundIdx })}
                    />
                  )}
                </div>
              );
            })}

            {isAdmin && (
              <button onClick={() => setShowNewMatch(!showNewMatch)}
                className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center justify-center gap-2">
                <Icon name={showNewMatch ? "x" : "plus"} />
                {showNewMatch ? 'Cancel' : 'New Match'}
              </button>
            )}

            {isAdmin && showNewMatch && (
              <div className="bg-white rounded-lg shadow-sm p-4">
                <h3 className="font-semibold mb-4">New Match</h3>
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-medium mb-1">Date</label>
                      <input type="date" value={newMatch.date} onChange={(e) => setNewMatch({ ...newMatch, date: e.target.value })}

                    <div>
                      <label className="block text-sm font-medium mb-1">Time</label>
                      <input type="time" value={newMatch.time} onChange={(e) => setNewMatch({ ...newMatch, time: e.target.value })}
                        className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-2">Format</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['open', 'americano', 'mexicano'].map(f => (
                        <button key={f} onClick={() => setNewMatch({ ...newMatch, format: f })}
                          className={`p-2 rounded-lg border-2 text-xs ${newMatch.format === f ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200'}`}>

                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-medium mb-1">Courts</label>
                      <input type="number" min="1" value={newMatch.courts} 
                        onChange={(e) => setNewMatch({ ...newMatch, courts: parseInt(e.target.value) || 1 })}
                        className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-1">Court Fee (£)</label>
                      <input type="number" step="0.01" value={newMatch.courtFee}
                        onChange={(e) => setNewMatch({ ...newMatch, courtFee: e.target.value })}

                  <div>
                    <label className="block text-sm font-medium mb-1">Location</label>
                    <select value={newMatch.location} 
                      onChange={(e) => setNewMatch({ ...newMatch, location: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg text-sm">
                      <option value="">Select location...</option>
                      {locs.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-2">
                      Players ({newMatch.selectedPlayers.length} selected)
                    </label>
                    <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto">
                      {players.map(p => (
                        <button key={p.id}
                          onClick={() => {
                            const selected = newMatch.selectedPlayers.includes(p.id);
                            setNewMatch({
                              ...newMatch,
                              selectedPlayers: selected 
                                ? newMatch.selectedPlayers.filter(id => id !== p.id)
                                : [...newMatch.selectedPlayers, p.id]
                            });
                          }}
                          className={`p-2 text-xs rounded-lg border-2 ${
                            newMatch.selectedPlayers.includes(p.id) 
                              ? 'border-indigo-500 bg-indigo-50' 
                              : 'border-gray-200'
                          }`}>
                          {p.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button onClick={createMatch}
                    disabled={newMatch.selectedPlayers.length < 4 || !newMatch.courtFee}
                    className="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                    Create Match
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {view === 'stats' && (
          <div className="bg-white rounded-lg shadow-sm p-6">
            <h2 className="text-xl font-bold mb-4">Statistics</h2>
            <div className="grid grid-cols-2 gap-4">
              <div className="p-4 bg-green-50 rounded-lg">
                <div className="text-2xl font-bold text-green-600">£{totalRev.toFixed(2)}</div>
                <div className="text-sm text-gray-600">Total Revenue</div>
              </div>
              <div className="p-4 bg-blue-50 rounded-lg">
                <div className="text-2xl font-bold text-blue-600">£{totalCol.toFixed(2)}</div>
                <div className="text-sm text-gray-600">Collected</div>
              </div>
            </div>
          </div>
        )}

        {view === 'players' && (
          <div className="space-y-4">
            {players.map(p => (
              <div key={p.id} className="bg-white rounded-lg shadow-sm p-4">
                <div className="flex justify-between items-start">
                  <div className="flex-1">
                    <h3 className="font-semibold">{p.name}</h3>
                    {p.email && <p className="text-xs text-gray-500">📧 {p.email}</p>}
                  </div>
                  {isAdmin && (
                    <button onClick={() => {
                      setEditingPlayer(p.id);
                      setPlayerForm({
                        name: p.name,
                        paypalLink: p.paypalLink || '',
                        revolutLink: p.revolutLink || '',
                        bankDetails: p.bankDetails || '',
                        email: p.email || ''
                      });
                    }} className="text-indigo-600 hover:text-indigo-800">
                      <Icon name="edit" />
                    </button>
                  )}
                </div>
              </div>
            ))}

            {isAdmin && (
              <button onClick={() => setShowNewPlayer(!showNewPlayer)}
                className="w-full py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                {showNewPlayer ? 'Cancel' : 'Add Player'}
              </button>
            )}

            {isAdmin && showNewPlayer && (
              <div className="bg-white rounded-lg shadow-sm p-4">
                <h3 className="font-semibold mb-4">New Player</h3>
                <div className="space-y-3">
                  <input type="text" placeholder="Name" value={playerForm.name}
                    onChange={(e) => setPlayerForm({ ...playerForm, name: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg" />
                  <input type="email" placeholder="Email (optional)" value={playerForm.email}
                    onChange={(e) => setPlayerForm({ ...playerForm, email: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg" />
                  <input type="url" placeholder="PayPal Link" value={playerForm.paypalLink}
                    onChange={(e) => setPlayerForm({ ...playerForm, paypalLink: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg" />
                  <input type="url" placeholder="Revolut Link" value={playerForm.revolutLink}
                    onChange={(e) => setPlayerForm({ ...playerForm, revolutLink: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg" />
                  <input type="text" placeholder="Bank Details" value={playerForm.bankDetails}
                    onChange={(e) => setPlayerForm({ ...playerForm, bankDetails: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg" />
                  <button onClick={addPlayer} className="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    Add Player
                  </button>
                </div>
              </div>
            )}

            {editingPlayer && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-lg p-6 max-w-md w-full">
                  <h3 className="font-semibold mb-4">Edit Player</h3>
                  <div className="space-y-3">
                    <input type="text" placeholder="Name" value={playerForm.name}
                      onChange={(e) => setPlayerForm({ ...playerForm, name: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg" />
                    <input type="email" placeholder="Email (optional)" value={playerForm.email}
                      onChange={(e) => setPlayerForm({ ...playerForm, email: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg" />
                    <input type="url" placeholder="PayPal Link" value={playerForm.paypalLink}
                      onChange={(e) => setPlayerForm({ ...playerForm, paypalLink: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg" />
                    <input type="url" placeholder="Revolut Link" value={playerForm.revolutLink}
                      onChange={(e) => setPlayerForm({ ...playerForm, revolutLink: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg" />
                    <input type="text" placeholder="Bank Details" value={playerForm.bankDetails}
                      onChange={(e) => setPlayerForm({ ...playerForm, bankDetails: e.target.value })}
                      className="w-full px-3 py-2 border rounded-lg" />
                    <div className="flex gap-2">
                      <button onClick={updatePlayer} className="flex-1 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                        Save
                      </button>
                      <button onClick={() => {
                        setEditingPlayer(null);
                        setPlayerForm({ name: '', paypalLink: '', revolutLink: '', bankDetails: '', email: '' });
                      }} className="flex-1 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                        Cancel
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {view === 'admin' && isAdmin && (
          <div className="bg-white rounded-lg shadow-sm p-6">
            <h2 className="text-xl font-bold mb-4">Admin Panel</h2>
            <div className="space-y-4">
              <div className="p-4 border rounded-lg">
                <h3 className="font-semibold mb-2">Quick Stats</h3>
                <div className="grid grid-cols-2 gap-3 text-sm">
                  <div>Total Players: <strong>{players.length}</strong></div>
                  <div>Total Matches: <strong>{matches.length}</strong></div>
                  <div>Revenue: <strong>£{totalRev.toFixed(2)}</strong></div>
                  <div>Collected: <strong>£{totalCol.toFixed(2)}</strong></div>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function TournamentView({ match, players, isAdmin, onInputScores }) {
  const sortedPlayers = [...(match.tournamentPlayers || [])].sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    return b.gamesWon - a.gamesWon;
  });

  const currentRound = match.tournamentRounds?.find(r => !r.completed);
  const allRoundsComplete = match.tournamentRounds?.every(r => r.completed);

  return (
    <div className="mt-4 border-t pt-4 space-y-4">
      {/* Leaderboard */}
      <div>
        <div className="flex items-center justify-between mb-3">
          <h4 className="font-semibold">Leaderboard</h4>
          {match.targetPoints && (
            <span className="text-xs text-gray-500">Target: {match.targetPoints} pts</span>
          )}
        </div>
        <div className="space-y-2">
          {sortedPlayers.map((p, idx) => {
            const isWinner = match.targetPoints && p.points >= match.targetPoints;
            return (
              <div key={p.id} className={`flex items-center justify-between p-2 rounded ${
                isWinner ? 'bg-yellow-100 border-2 border-yellow-400' : 'bg-gray-50'
              }`}>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-gray-400 w-6">#{idx + 1}</span>
                  <span className="font-medium">{p.name}</span>
                  {isWinner && <span className="text-yellow-600">👑</span>}
                </div>
                <div className="text-right">
                  <div className="font-bold text-indigo-600">{p.points} pts</div>
                  <div className="text-xs text-gray-500">{p.gamesWon} wins</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Current Round */}
      {currentRound && isAdmin && (
        <div>
          <div className="flex items-center justify-between mb-3">
            <h4 className="font-semibold">Round {currentRound.number}</h4>
            <button 
              onClick={() => onInputScores(match, currentRound.number - 1)}
              className="px-3 py-1 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">
              Input Scores
            </button>
          </div>
          <div className="space-y-2">
            {currentRound.matches.map((m, idx) => {
              const team1Names = m.team1.map(id => players.find(p => p.id === id)?.name || '?').join(' & ');
              const team2Names = m.team2.map(id => players.find(p => p.id === id)?.name || '?').join(' & ');
              
              return (
                <div key={idx} className="bg-gray-50 p-3 rounded-lg">
                  <div className="text-xs text-gray-500 mb-1">Court {m.court}</div>
                  <div className="flex justify-between items-center">
                    <div className="flex-1">
                      <div className="text-sm font-medium">{team1Names}</div>
                      <div className="text-xs text-gray-600">vs</div>
                      <div className="text-sm font-medium">{team2Names}</div>
                    </div>
                    {m.score.team1 && m.score.team2 && (
                      <div className="text-right">
                        <div className="font-bold text-lg">{m.score.team1} - {m.score.team2}</div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Completed Rounds */}
      {match.tournamentRounds?.filter(r => r.completed).length > 0 && (
        <div>
          <h4 className="font-semibold mb-2">Previous Rounds</h4>
          <div className="space-y-2">
            {match.tournamentRounds.filter(r => r.completed).map(round => (
              <details key={round.number} className="bg-gray-50 p-3 rounded-lg">
                <summary className="cursor-pointer font-medium text-sm">Round {round.number}</summary>
                <div className="mt-2 space-y-2">
                  {round.matches.map((m, idx) => {
                    const team1Names = m.team1.map(id => players.find(p => p.id === id)?.name || '?').join(' & ');
                    const team2Names = m.team2.map(id => players.find(p => p.id === id)?.name || '?').join(' & ');
                    
                    return (
                      <div key={idx} className="text-xs p-2 bg-white rounded">
                        <div className="flex justify-between">
                          <div>
                            <div>{team1Names}</div>
                            <div className="text-gray-500">vs</div>
                            <div>{team2Names}</div>
                          </div>
                          <div className="font-bold">{m.score.team1} - {m.score.team2}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </details>
            ))}
          </div>
        </div>
      )}

      {allRoundsComplete && match.format === 'americano' && (
        <div className="bg-green-50 border-2 border-green-200 rounded-lg p-4 text-center">
          <div className="text-2xl mb-2">🏆</div>
          <div className="font-bold text-green-800">Tournament Complete!</div>
          <div className="text-sm text-green-600">Winner: {sortedPlayers[0]?.name}</div>
        </div>
      )}
    </div>
  );
}

function ScoreInputModal({ match, roundIndex, players, onSave, onClose }) {
  const [scores, setScores] = useState(() => {
    const round = match.tournamentRounds[roundIndex];
    return round.matches.map(m => ({
      team1: m.score.team1 || '',
      team2: m.score.team2 || ''
    }));
  });

  const handleSave = async () => {
    // Validate scores
    const allScoresEntered = scores.every(s => s.team1 && s.team2);
    if (!allScoresEntered) {
      alert('Please enter all scores');
      return;
    }

    // Check if scores add up to target points
    if (match.targetPoints) {
      const validScores = scores.every(s => {
        const total = parseInt(s.team1) + parseInt(s.team2);
        return total === match.targetPoints;
      });
      
      if (!validScores) {
        const proceed = confirm(`Some scores don't add up to ${match.targetPoints} points. Continue anyway?`);
        if (!proceed) return;
      }
    }

    // Update match in Firebase
    const updatedRounds = [...match.tournamentRounds];
    updatedRounds[roundIndex].matches = updatedRounds[roundIndex].matches.map((m, idx) => ({
      ...m,
      score: {
        team1: scores[idx].team1,
        team2: scores[idx].team2
      }
    }));

    await db.collection('matches').doc(match.id).update({
      tournamentRounds: updatedRounds
    });

    onSave(match.id, roundIndex);
  };

  const round = match.tournamentRounds[roundIndex];

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
        <div className="flex justify-between items-center mb-4">
          <h3 className="text-xl font-bold">Round {round.number} Scores</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600">
            <Icon name="x" />
          </button>
        </div>

        <div className="space-y-4">
          {round.matches.map((m, idx) => {
            const team1Names = m.team1.map(id => players.find(p => p.id === id)?.name || '?').join(' & ');
            const team2Names = m.team2.map(id => players.find(p => p.id === id)?.name || '?').join(' & ');
            
            return (
              <div key={idx} className="border rounded-lg p-4">
                <div className="text-xs text-gray-500 mb-2">Court {m.court}</div>
                
                <div className="space-y-3">
                  <div className="flex items-center gap-3">
                    <div className="flex-1 text-sm font-medium">{team1Names}</div>
                    <input 
                      type="number" 
                      min="0"
                      max={match.targetPoints || 100}
                      value={scores[idx].team1}
                      onChange={(e) => {
                        const newScores = [...scores];
                        newScores[idx].team1 = e.target.value;
                        setScores(newScores);
                      }}
                      className="w-20 px-3 py-2 border rounded-lg text-center font-bold"
                      placeholder="0"
                    />
                  </div>
                  
                  <div className="flex items-center gap-3">
                    <div className="flex-1 text-sm font-medium">{team2Names}</div>
                    <input 
                      type="number" 
                      min="0"
                      max={match.targetPoints || 100}
                      value={scores[idx].team2}
                      onChange={(e) => {
                        const newScores = [...scores];
                        newScores[idx].team2 = e.target.value;
                        setScores(newScores);
                      }}
                      className="w-20 px-3 py-2 border rounded-lg text-center font-bold"
                      placeholder="0"
                    />
                  </div>
                  
                  {match.targetPoints && scores[idx].team1 && scores[idx].team2 && (
                    <div className="text-xs text-center">
                      {parseInt(scores[idx].team1) + parseInt(scores[idx].team2) === match.targetPoints ? (
                        <span className="text-green-600">✓ Total: {match.targetPoints}</span>
                      ) : (
                        <span className="text-red-600">
                          Total: {parseInt(scores[idx].team1) + parseInt(scores[idx].team2)} (should be {match.targetPoints})
                        </span>
                      )}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div className="flex gap-3 mt-6">
          <button 
            onClick={handleSave}
            className="flex-1 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-semibold">
            Save Scores
          </button>
          <button 
            onClick={onClose}
            className="flex-1 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
            Cancel
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
