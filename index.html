<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Padel Club - League Manager</title>
    <link rel="manifest" href="ace-manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --ace-gold: #d4af37;
            --ace-dark: #1a1a1a;
            --ace-darker: #0d0d0d;
            --ace-light: #f5f5f5;
            --ace-grey: #6b6b6b;
            --ace-border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --shadow-gold: 0 0 30px rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--ace-darker);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px 50px;
            position: relative;
            border-bottom: 1px solid var(--ace-border);
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--ace-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .card {
            background: var(--ace-dark);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--ace-border);
            box-shadow: var(--shadow-gold);
        }

        .card h2 {
            font-family: 'Montserrat', sans-serif;
            color: var(--ace-gold);
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            padding: 15px 30px;
            background: var(--ace-dark);
            border: 2px solid var(--ace-border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .tab:hover {
            border-color: var(--ace-gold);
            color: var(--ace-gold);
        }

        .tab.active {
            background: var(--ace-gold);
            color: var(--ace-darker);
            border-color: var(--ace-gold);
        }

        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--ace-gold);
            color: var(--ace-darker);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--ace-gold);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--ace-darker);
            border: 1px solid var(--ace-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--ace-gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 600px; /* Ensures table doesn't squish on mobile */
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
            margin: 20px 0;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--ace-border);
            white-space: nowrap; /* Prevent text wrapping in table cells */
        }

        th {
            background: var(--ace-darker);
            color: var(--ace-gold);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Make team names wrap on very small screens */
        @media (max-width: 480px) {
            th:nth-child(2), td:nth-child(2) {
                white-space: normal;
                min-width: 120px;
            }
            
            th, td {
                padding: 10px 8px;
                font-size: 0.9rem;
            }
        }

        tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        .fixture {
            background: var(--ace-darker);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--ace-border);
        }

        .fixture-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .fixture-team {
            flex: 1;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .vs {
            padding: 0 20px;
            color: var(--ace-gold);
            font-weight: 700;
        }

        .fixture-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .user-info {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .btn-logout {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--ace-border);
            color: var(--text-secondary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            border-color: var(--ace-gold);
            color: var(--ace-gold);
        }

        .team-badge {
            display: inline-block;
            padding: 5px 15px;
            background: var(--ace-gold);
            color: var(--ace-darker);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-left: 10px;
        }

        .submit-score-section {
            background: var(--ace-darker);
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border: 2px solid var(--ace-gold);
        }

        .score-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
            }
            
            .user-info {
                position: static;
                justify-content: center;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyABpBxHPcvTcMej6tgI8VRb0Cvb-liMqEU",
            authDomain: "ace-padel-league.firebaseapp.com",
            projectId: "ace-padel-league",
            storageBucket: "ace-padel-league.firebasestorage.app",
            messagingSenderId: "505879912474",
            appId: "1:505879912474:web:3baa31c2897379f811f1a3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Auth Screen Component
        function AuthScreen() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    if (isRegister) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleForgotPassword = async () => {
                if (!email) {
                    setError('Please enter your email address first');
                    return;
                }

                try {
                    await auth.sendPasswordResetEmail(email);
                    alert('Password reset email sent! Check your inbox (and spam folder)');
                } catch (err) {
                    if (err.code === 'auth/user-not-found') {
                        setError('No account found with this email address');
                    } else {
                        setError(err.message);
                    }
                }
            };

            return (
                <div className="container">
                    <header>
                        <h1>Ace Padel Club</h1>
                        <p className="subtitle">League Manager</p>
                        <p className="location">Oswestry, Shropshire</p>
                    </header>

                    <div className="card" style={{ maxWidth: '500px', margin: '0 auto' }}>
                        <h2>{isRegister ? 'Create Account' : 'Login'}</h2>
                        {error && (
                            <div style={{ 
                                background: '#ff4444', 
                                padding: '15px', 
                                borderRadius: '8px', 
                                marginBottom: '20px',
                                color: 'white'
                            }}>
                                {error}
                            </div>
                        )}
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    placeholder="your.email@example.com"
                                />
                            </div>
                            <div className="form-group">
                                <label>Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    placeholder="••••••••"
                                    minLength="6"
                                />
                            </div>
                            <button 
                                type="submit" 
                                className="btn btn-primary" 
                                style={{ width: '100%', marginBottom: '15px' }}
                                disabled={loading}
                            >
                                {loading ? 'Please wait...' : (isRegister ? 'Create Account' : 'Login')}
                            </button>
                        </form>

                        {!isRegister && (
                            <div style={{ textAlign: 'center', marginBottom: '15px' }}>
                                <button
                                    onClick={handleForgotPassword}
                                    style={{
                                        background: 'none',
                                        border: 'none',
                                        color: 'var(--ace-gold)',
                                        cursor: 'pointer',
                                        textDecoration: 'underline',
                                        fontSize: '0.9rem'
                                    }}
                                >
                                    Forgot password?
                                </button>
                            </div>
                        )}

                        <div style={{ textAlign: 'center', color: 'var(--text-secondary)' }}>
                            {isRegister ? 'Already have an account?' : "Don't have an account?"}
                            {' '}
                            <button
                                onClick={() => {
                                    setIsRegister(!isRegister);
                                    setError('');
                                }}
                                style={{
                                    background: 'none',
                                    border: 'none',
                                    color: 'var(--ace-gold)',
                                    cursor: 'pointer',
                                    textDecoration: 'underline',
                                    fontSize: '1rem'
                                }}
                            >
                                {isRegister ? 'Login' : 'Register'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Team Selection Screen
        function TeamSelectionScreen({ user, onTeamSelected }) {
            const [teams, setTeams] = useState([]);
            const [selectedTeam, setSelectedTeam] = useState('');
            const [playerName, setPlayerName] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                loadTeams();
            }, []);

            const loadTeams = async () => {
                try {
                    console.log('Loading teams...');
                    const snapshot = await db.collection('teams').get();
                    console.log('Teams snapshot received:', snapshot.size, 'documents');
                    
                    const teamsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    console.log('Teams loaded:', teamsData.length);
                    console.log('First team:', teamsData[0]);
                    
                    // Sort in JavaScript instead of Firestore query
                    teamsData.sort((a, b) => {
                        if (a.league !== b.league) {
                            return a.league.localeCompare(b.league);
                        }
                        return a.name.localeCompare(b.name);
                    });
                    
                    setTeams(teamsData);
                } catch (error) {
                    console.error('Error loading teams:', error);
                    alert('Error loading teams: ' + error.message);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    await db.collection('players').doc(user.uid).set({
                        email: user.email,
                        teamId: selectedTeam,
                        playerName: playerName,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    onTeamSelected();
                } catch (error) {
                    console.error('Error linking team:', error);
                    alert('Error linking team: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const teamsByLeague = teams.reduce((acc, team) => {
                if (!acc[team.league]) acc[team.league] = [];
                acc[team.league].push(team);
                return acc;
            }, {});

            return (
                <div className="container">
                    <header>
                        <h1>Welcome to Ace Padel!</h1>
                        <p className="subtitle">Link Your Team</p>
                    </header>

                    <div className="card" style={{ maxWidth: '600px', margin: '0 auto' }}>
                        <h2>Select Your Team</h2>
                        <p style={{ color: 'var(--text-secondary)', marginBottom: '30px' }}>
                            Choose your team to view fixtures and submit match scores
                        </p>
                        
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Your Name</label>
                                <input
                                    type="text"
                                    value={playerName}
                                    onChange={(e) => setPlayerName(e.target.value)}
                                    required
                                    placeholder="Enter your name"
                                />
                            </div>

                            <div className="form-group">
                                <label>Your Team</label>
                                <select
                                    value={selectedTeam}
                                    onChange={(e) => setSelectedTeam(e.target.value)}
                                    required
                                >
                                    <option value="">-- Select Your Team --</option>
                                    {Object.entries(teamsByLeague).map(([league, leagueTeams]) => (
                                        <optgroup key={league} label={getDisplayName(league)}>
                                            {leagueTeams.map(team => (
                                                <option key={team.id} value={team.id}>
                                                    {team.name}
                                                </option>
                                            ))}
                                        </optgroup>
                                    ))}
                                </select>
                            </div>

                            <button
                                type="submit"
                                className="btn btn-primary"
                                style={{ width: '100%' }}
                                disabled={loading}
                            >
                                {loading ? 'Saving...' : 'Continue'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [playerData, setPlayerData] = useState(null);
            const [activeTab, setActiveTab] = useState('fixtures');
            const [teams, setTeams] = useState([]);
            const [fixtures, setFixtures] = useState([]);
            const [selectedLeague, setSelectedLeague] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    setUser(user);
                    if (user) {
                        await loadPlayerData(user.uid);
                        await loadTeams();
                        await loadFixtures();
                    }
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const loadPlayerData = async (userId) => {
                try {
                    const doc = await db.collection('players').doc(userId).get();
                    if (doc.exists) {
                        setPlayerData(doc.data());
                        // Set league filter based on player's team
                        const teamDoc = await db.collection('teams').doc(doc.data().teamId).get();
                        if (teamDoc.exists) {
                            setSelectedLeague(teamDoc.data().league);
                        }
                    }
                } catch (error) {
                    console.error('Error loading player data:', error);
                }
            };

            const loadTeams = async () => {
                try {
                    console.log('Loading teams in main app...');
                    const snapshot = await db.collection('teams').get();
                    console.log('Teams loaded:', snapshot.size);
                    
                    const teamsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Sort in JavaScript
                    teamsData.sort((a, b) => {
                        if (a.league !== b.league) {
                            return a.league.localeCompare(b.league);
                        }
                        return a.name.localeCompare(b.name);
                    });
                    
                    setTeams(teamsData);
                } catch (error) {
                    console.error('Error loading teams:', error);
                }
            };

            const loadFixtures = async () => {
                try {
                    const snapshot = await db.collection('fixtures').where('completed', '==', false).get();
                    const fixturesData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setFixtures(fixturesData);
                } catch (error) {
                    console.error('Error loading fixtures:', error);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
            };

            if (loading) {
                return (
                    <div className="container">
                        <div className="empty-state">
                            <p>Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <AuthScreen />;
            }

            if (!playerData) {
                return <TeamSelectionScreen user={user} onTeamSelected={() => loadPlayerData(user.uid)} />;
            }

            const playerTeam = teams.find(t => t.id === playerData.teamId);

            return (
                <div className="container">
                    <header>
                        <h1>Ace Padel Club</h1>
                        <p className="subtitle">League Manager</p>
                        <p className="location">Oswestry, Shropshire</p>
                        <div className="user-info">
                            <div>
                                <div className="user-email">{user.email}</div>
                                {playerTeam && (
                                    <span className="team-badge">{playerTeam.name}</span>
                                )}
                            </div>
                            <button onClick={handleLogout} className="btn-logout">Logout</button>
                        </div>
                    </header>

                    <div className="tabs">
                        <button 
                            className={`tab ${activeTab === 'fixtures' ? 'active' : ''}`}
                            onClick={() => setActiveTab('fixtures')}
                        >
                            My Fixtures
                        </button>
                        <button 
                            className={`tab ${activeTab === 'tables' ? 'active' : ''}`}
                            onClick={() => setActiveTab('tables')}
                        >
                            All League Tables
                        </button>
                        <button 
                            className={`tab ${activeTab === 'results' ? 'active' : ''}`}
                            onClick={() => setActiveTab('results')}
                        >
                            Results
                        </button>
                        <button 
                            className={`tab ${activeTab === 'profile' ? 'active' : ''}`}
                            onClick={() => setActiveTab('profile')}
                        >
                            My Profile
                        </button>
                    </div>

                    {activeTab === 'fixtures' && (
                        <FixturesView 
                            fixtures={fixtures} 
                            teams={teams} 
                            playerData={playerData}
                            selectedLeague={selectedLeague}
                            onUpdate={loadFixtures}
                            loadTeams={loadTeams}
                        />
                    )}
                    {activeTab === 'tables' && (
                        <AllLeagueTables teams={teams} playerLeague={selectedLeague} />
                    )}
                    {activeTab === 'results' && (
                        <ResultsView 
                            teams={teams}
                            selectedLeague={selectedLeague}
                            activeTab={activeTab}
                        />
                    )}
                    {activeTab === 'profile' && (
                        <ProfileEditor 
                            user={user}
                            playerData={playerData}
                            teams={teams}
                            onUpdate={() => loadPlayerData(user.uid)}
                        />
                    )}
                </div>
            );
        }

        // Fixtures View Component
        function FixturesView({ fixtures, teams, playerData, selectedLeague, onUpdate, loadTeams }) {
            const [submittingScore, setSubmittingScore] = useState(null);

            const getTeamName = (teamId) => {
                const team = teams.find(t => t.id === teamId);
                return team ? team.name : 'Unknown Team';
            };

            const getTeamLeague = (teamId) => {
                const team = teams.find(t => t.id === teamId);
                return team ? team.league : null;
            };

            const isMyFixture = (fixture) => {
                return fixture.team1 === playerData.teamId || fixture.team2 === playerData.teamId;
            };

            // Filter fixtures: only show current week's fixtures (week-by-week release)
            const now = new Date();
            const nextSunday = new Date(now);
            nextSunday.setDate(now.getDate() + (7 - now.getDay())); // Next Sunday
            nextSunday.setHours(23, 59, 59, 999);

            const filteredFixtures = fixtures.filter(fixture => {
                // Filter by league
                const team1League = getTeamLeague(fixture.team1);
                if (team1League !== selectedLeague) return false;

                // Only show fixtures for this week
                if (!fixture.date) return false;
                const fixtureDate = new Date(fixture.date.seconds * 1000);
                return fixtureDate <= nextSunday;
            });

            const handleSubmitScore = async (fixtureId, scores) => {
                try {
                    console.log('Submitting score for fixture:', fixtureId);
                    console.log('Scores:', scores);
                    
                    const fixture = fixtures.find(f => f.id === fixtureId);
                    if (!fixture) {
                        throw new Error('Fixture not found');
                    }
                    
                    // Calculate which team won each set (simpler logic)
                    const team1SetsWon = [
                        scores.set1Team1 > scores.set1Team2 ? 1 : 0,
                        scores.set2Team1 > scores.set2Team2 ? 1 : 0,
                        scores.set3Team1 > scores.set3Team2 ? 1 : 0
                    ].reduce((a, b) => a + b, 0);
                    
                    const team1SetsTied = [
                        scores.set1Team1 === scores.set1Team2 ? 1 : 0,
                        scores.set2Team1 === scores.set2Team2 ? 1 : 0,
                        scores.set3Team1 === scores.set3Team2 ? 1 : 0
                    ].reduce((a, b) => a + b, 0);
                    
                    const team1SetsLost = 3 - team1SetsWon - team1SetsTied;
                    
                    const team2SetsWon = team1SetsLost;
                    const team2SetsTied = team1SetsTied;
                    const team2SetsLost = team1SetsWon;
                    
                    // Calculate points (3 per set won, 1 per set tied)
                    const team1Points = (team1SetsWon * 3) + (team1SetsTied * 1);
                    const team2Points = (team2SetsWon * 3) + (team2SetsTied * 1);
                    
                    // Determine match winner (who won more sets)
                    const winner = team1SetsWon > team2SetsWon ? fixture.team1 : 
                                   team2SetsWon > team1SetsWon ? fixture.team2 : null;
                    
                    console.log('Team 1 stats:', { setsWon: team1SetsWon, setsTied: team1SetsTied, setsLost: team1SetsLost, points: team1Points });
                    console.log('Team 2 stats:', { setsWon: team2SetsWon, setsTied: team2SetsTied, setsLost: team2SetsLost, points: team2Points });
                    console.log('Winner:', winner);

                    // Update fixture in Firestore
                    await db.collection('fixtures').doc(fixtureId).update({
                        set1Team1: scores.set1Team1,
                        set1Team2: scores.set1Team2,
                        set2Team1: scores.set2Team1,
                        set2Team2: scores.set2Team2,
                        set3Team1: scores.set3Team1,
                        set3Team2: scores.set3Team2,
                        completed: true,
                        completedBy: playerData.playerName,
                        completedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    console.log('✅ Fixture updated in Firestore');

                    // Update Team 1 stats
                    const team1Ref = db.collection('teams').doc(fixture.team1);
                    const team1Doc = await team1Ref.get();
                    const team1Data = team1Doc.data();
                    
                    await team1Ref.update({
                        played: (team1Data.played || 0) + 1,
                        won: winner === fixture.team1 ? (team1Data.won || 0) + 1 : (team1Data.won || 0),
                        lost: winner === fixture.team2 ? (team1Data.lost || 0) + 1 : (team1Data.lost || 0),
                        setsWon: (team1Data.setsWon || 0) + team1SetsWon,
                        setsTied: (team1Data.setsTied || 0) + team1SetsTied,
                        setsLost: (team1Data.setsLost || 0) + team1SetsLost,
                        points: (team1Data.points || 0) + team1Points
                    });
                    console.log('✅ Team 1 stats updated');

                    // Update Team 2 stats
                    const team2Ref = db.collection('teams').doc(fixture.team2);
                    const team2Doc = await team2Ref.get();
                    const team2Data = team2Doc.data();
                    
                    await team2Ref.update({
                        played: (team2Data.played || 0) + 1,

                        lost: winner === fixture.team1 ? (team2Data.lost || 0) + 1 : (team2Data.lost || 0),

                    console.log('✅ Team 2 stats updated');

        // Results View Component
        function ResultsView({ teams, selectedLeague, activeTab }) {
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (activeTab === 'results') {
                    loadResults();
                }
            }, [selectedLeague, activeTab]);

            const loadResults = async () => {
                try {
                    setLoading(true);
                    console.log('Loading results for league:', selectedLeague);
                    
                    const snapshot = await db.collection('fixtures')
                        .where('completed', '==', true)
                        .get(); // Remove orderBy to avoid index requirement
                    
                    console.log('Found', snapshot.size, 'completed fixtures');
                    
                    const resultsData = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Sort by completedAt in JavaScript instead
                    resultsData.sort((a, b) => {
                        if (!a.completedAt || !b.completedAt) return 0;
                        return b.completedAt.seconds - a.completedAt.seconds;
                    });
                    
                    setResults(resultsData);
                    console.log('Results loaded:', resultsData.length);
                    setLoading(false);
                } catch (error) {
                    console.error('Error loading results:', error);
                    setLoading(false);
                }
            };

            const getTeamName = (teamId) => {
                const team = teams.find(t => t.id === teamId);
                return team ? team.name : 'Unknown Team';
            };

            const getTeamLeague = (teamId) => {
                const team = teams.find(t => t.id === teamId);
                return team ? team.league : null;
            };

            const filteredResults = results.filter(result => {
                const team1League = getTeamLeague(result.team1);
                return team1League === selectedLeague;
            });

            if (loading) {
                return (
                    <div className="card">
                        <h2>{getDisplayName(selectedLeague)} - Recent Results</h2>
                        <div className="empty-state">
                            <p>Loading results...</p>
                        </div>
                    </div>
                );
            }

            if (filteredResults.length === 0) {
                return (
                    <div className="card">
                        <h2>{getDisplayName(selectedLeague)} - Recent Results</h2>
                        <div className="empty-state">
                            <p>No results yet</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="card">
                    <h2>{getDisplayName(selectedLeague)} - Recent Results</h2>
                    {filteredResults.map((result) => {
                        const team1Sets = [
                            result.set1Team1 > result.set1Team2 ? 1 : 0,
                            result.set2Team1 > result.set2Team2 ? 1 : 0,
                            result.set3Team1 > result.set3Team2 ? 1 : 0
                        ].reduce((a, b) => a + b, 0);

                        const team2Sets = [
                            result.set1Team2 > result.set1Team1 ? 1 : 0,
                            result.set2Team2 > result.set2Team1 ? 1 : 0,
                            result.set3Team2 > result.set3Team1 ? 1 : 0
                        ].reduce((a, b) => a + b, 0);

                        return (
                            <div key={result.id} className="fixture">
                                <div className="fixture-teams">
                                    <div className="fixture-team">
                                        {getTeamName(result.team1)}
                                        <span style={{ 
                                            marginLeft: '15px', 
                                            color: 'var(--ace-gold)', 
                                            fontWeight: '700',
                                            fontSize: '1.3rem'
                                        }}>
                                            {team1Sets}
                                        </span>
                                    </div>
                                    <div className="vs">-</div>
                                    <div className="fixture-team" style={{ textAlign: 'right' }}>
                                        <span style={{ 
                                            marginRight: '15px', 
                                            color: 'var(--ace-gold)', 
                                            fontWeight: '700',
                                            fontSize: '1.3rem'
                                        }}>
                                            {team2Sets}
                                        </span>
                                        {getTeamName(result.team2)}
                                    </div>
                                </div>
                                <div style={{ 
                                    display: 'flex', 
                                    justifyContent: 'space-between', 
                                    marginTop: '10px',
                                    fontSize: '0.9rem',
                                    color: 'var(--text-secondary)'
                                }}>
                                    <div>
                                        Sets: {result.set1Team1}-{result.set1Team2} | {result.set2Team1}-{result.set2Team2} | {result.set3Team1}-{result.set3Team2}
                                    </div>
                                    <div>
                                        Submitted by: {result.completedBy}
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
