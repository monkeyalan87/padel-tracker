<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Match Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function Icon({ name }) {
          useEffect(() => {
            lucide.createIcons();
          });
          return React.createElement('i', { 'data-lucide': name });
        }

        function App() {
          const [message, setMessage] = useState('Loading...');
          
          useEffect(() => {
            setMessage('Padel Tracker is working!');
            lucide.createIcons();
          }, []);

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 flex items-center justify-center">
              <div className="bg-white rounded-lg shadow-lg p-8 max-w-md">
                <h1 className="text-3xl font-bold text-gray-900 mb-4">Padel Tracker</h1>
                <p className="text-lg text-gray-600 mb-4">{message}</p>
                <div className="flex gap-2">
                  <Icon name="check-circle" />
                  <span>React is working</span>
                </div>
                <div className="flex gap-2 mt-2">
                  <Icon name="users" />
                  <span>Icons are working</span>
                </div>
                <div className="mt-4 p-4 bg-green-50 rounded">
                  <p className="text-sm text-green-800">✓ All systems operational</p>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
