<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Padel Tracker">
    <meta name="theme-color" content="#4F46E5">
    <title>Padel Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link href="https://unpkg.com/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #root { min-height: 100vh; }
        input, textarea { 
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        function Icon({ name, ...props }) {
          React.useEffect(() => {
            lucide.createIcons();
          });
          return React.createElement('i', { 'data-lucide': name, ...props });
        }

        function PadelTracker() {
          const loadFromStorage = (key, defaultValue) => {
            try {
              const saved = localStorage.getItem(key);
              return saved ? JSON.parse(saved) : defaultValue;
            } catch {
              return defaultValue;
            }
          };

          const [view, setView] = useState('matches');
          const [players, setPlayers] = useState(() => loadFromStorage('players', [
            { id: 1, name: 'Alex' },
            { id: 2, name: 'Sam' },
            { id: 3, name: 'Jordan' },
            { id: 4, name: 'Casey' }
          ]));
          const [matches, setMatches] = useState(() => loadFromStorage('matches', []));
          const [showNewMatch, setShowNewMatch] = useState(false);
          const [showNewPlayer, setShowNewPlayer] = useState(false);
          const [newPlayerName, setNewPlayerName] = useState('');
          const [showPasswordPrompt, setShowPasswordPrompt] = useState(false);
          const [tempPassword, setTempPassword] = useState('');
          const [passwordAction, setPasswordAction] = useState(null);
          const [playerToDelete, setPlayerToDelete] = useState(null);
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          
          const ADMIN_PASSWORD = 'padel2025';
          
          const [newMatch, setNewMatch] = useState({
            date: new Date().toISOString().split('T')[0],
            time: '',
            courtFee: '',
            courts: 1,
            format: 'open',
            location: '',
            selectedPlayers: []
          });

          const locations = [
            'Wrexham Tennis Centre',
            'Padel Shed Wrexham',
            'Ace Padel Club @ Lion Quays',
            'Padel at CNW Golf Academy'
          ];

          React.useEffect(() => {
            localStorage.setItem('players', JSON.stringify(players));
          }, [players]);

          React.useEffect(() => {
            localStorage.setItem('matches', JSON.stringify(matches));
          }, [matches]);

          React.useEffect(() => {
            lucide.createIcons();
          });

          const checkPassword = () => {
            if (tempPassword === ADMIN_PASSWORD) {
              setIsAuthenticated(true);
              setShowPasswordPrompt(false);
              setTempPassword('');
              
              if (passwordAction === 'addPlayer') {
                setShowNewPlayer(true);
              } else if (passwordAction === 'deletePlayer' && playerToDelete) {
                setPlayers(players.filter(p => p.id !== playerToDelete));
                setPlayerToDelete(null);
              }
              setPasswordAction(null);
            } else {
              alert('Incorrect password');
              setTempPassword('');
            }
          };

          const requestAuth = (action, playerId = null) => {
            setPasswordAction(action);
            if (playerId) setPlayerToDelete(playerId);
            setShowPasswordPrompt(true);
          };

          const addPlayer = () => {
            if (newPlayerName.trim()) {
              setPlayers([...players, { id: Date.now(), name: newPlayerName.trim() }]);
              setNewPlayerName('');
              setShowNewPlayer(false);
              setIsAuthenticated(false);
            }
          };

          const createMatch = () => {
            if (newMatch.selectedPlayers.length >= 4 && newMatch.courtFee) {
              setMatches([{
                id: Date.now(),
                ...newMatch,
                courtFee: parseFloat(newMatch.courtFee),
                players: newMatch.selectedPlayers.map(id => ({
                  id,
                  name: players.find(p => p.id === id).name,
                  paid: false
                }))
              }, ...matches]);
              
              setNewMatch({
                date: new Date().toISOString().split('T')[0],
                time: '',
                courtFee: '',
                courts: 1,
                format: 'open',
                location: '',
                selectedPlayers: []
              });
              setShowNewMatch(false);
            }
          };

          const generateICS = (match) => {
            const formatDate = (dateStr, timeStr) => {
              const date = new Date(dateStr + 'T' + (timeStr || '00:00'));
              return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };

            const startDate = formatDate(match.date, match.time);
            const endDateTime = new Date(match.date + 'T' + (match.time || '00:00'));
            endDateTime.setHours(endDateTime.getHours() + 2);
            const endDateFormatted = endDateTime.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

            const formatLabel = match.format === 'open' ? 'Open Match' : 
                               match.format === 'americano' ? 'Americano' : 'Mexicano';
            
            const playerList = match.players.map(p => p.name).join(', ');
            const location = match.location || 'Padel Court';

            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Padel Tracker//EN
BEGIN:VEVENT
UID:${match.id}@padeltracker.com
DTSTAMP:${formatDate(new Date().toISOString().split('T')[0], '00:00')}
DTSTART:${startDate}
DTEND:${endDateFormatted}
SUMMARY:Padel Match - ${formatLabel}
DESCRIPTION:Players: ${playerList}\\nFormat: ${formatLabel}\\nCourt Fee: £${match.courtFee.toFixed(2)}
LOCATION:${location}
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `padel-match-${match.date}.ics`;
            link.click();
            URL.revokeObjectURL(url);
          };

          const togglePlayerSelection = (playerId) => {
            const max = newMatch.courts * 4;
            if (newMatch.selectedPlayers.includes(playerId)) {
              setNewMatch({
                ...newMatch,
                selectedPlayers: newMatch.selectedPlayers.filter(id => id !== playerId)
              });
            } else if (newMatch.selectedPlayers.length < max) {
              setNewMatch({
                ...newMatch,
                selectedPlayers: [...newMatch.selectedPlayers, playerId]
              });
            }
          };

          const togglePayment = (matchId, playerId) => {
            setMatches(matches.map(m => {
              if (m.id === matchId) {
                return {
                  ...m,
                  players: m.players.map(p =>
                    p.id === playerId ? { ...p, paid: !p.paid } : p
                  )
                };
              }
              return m;
            }));
          };

          const feePerPlayer = newMatch.courtFee && newMatch.selectedPlayers.length > 0 
            ? (parseFloat(newMatch.courtFee) / newMatch.selectedPlayers.length).toFixed(2) 
            : '0.00';

          const totalRevenue = matches.reduce((sum, m) => sum + m.courtFee, 0);
          const totalCollected = matches.reduce((sum, m) => {
            const paid = m.players.filter(p => p.paid).length;
            return sum + (m.courtFee / m.players.length) * paid;
          }, 0);

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
              <div className="bg-white shadow-sm border-b">
                <div className="max-w-2xl mx-auto px-4 py-4">
                  <h1 className="text-2xl font-bold text-gray-900">Padel Tracker</h1>
                  <p className="text-sm text-gray-600">Manage matches and payments</p>
                </div>
              </div>

              <div className="max-w-2xl mx-auto px-4 py-4">
                <div className="bg-white rounded-lg shadow-sm p-1 grid grid-cols-5 gap-1">
                  {['matches', 'tournament', 'stats', 'admin', 'players'].map(tab => (
                    <button
                      key={tab}
                      onClick={() => setView(tab)}
                      className={`py-2 px-2 rounded-md text-xs font-medium transition-colors ${
                        view === tab ? 'bg-indigo-600 text-white' : 'text-gray-700 hover:bg-gray-100'
                      }`}
                    >
                      {tab.charAt(0).toUpperCase() + tab.slice(1)}
                    </button>
                  ))}
                </div>
              </div>

              <div className="max-w-2xl mx-auto px-4 pb-24">
                {view === 'matches' && (
                  <div className="space-y-4">
                    {matches.length === 0 && !showNewMatch && (
                      <div className="bg-white rounded-lg shadow-sm p-8 text-center">
                        <div className="text-6xl mb-4">📅</div>
                        <p className="text-gray-600">No matches yet</p>
                      </div>
                    )}

                    {matches
                      .sort((a, b) => new Date(a.date + ' ' + (a.time || '00:00')) - new Date(b.date + ' ' + (b.time || '00:00')))
                      .map(match => {
                      const paidCount = match.players.filter(p => p.paid).length;
                      const allPaid = paidCount === match.players.length;
                      const matchDate = new Date(match.date + ' ' + (match.time || '00:00'));
                      const isUpcoming = matchDate >= new Date();
                      
                      return (
                        <div key={match.id} className="bg-white rounded-lg shadow-sm p-4">
                          <div className="flex justify-between mb-3">
                            <div className="flex-1">
                              <div className="flex items-center gap-2 mb-1">
                                <h3 className="font-semibold">{match.courts} Court{match.courts > 1 ? 's' : ''}</h3>
                                <span className={`px-2 py-0.5 text-xs rounded-full ${
                                  match.format === 'open' ? 'bg-blue-100 text-blue-700' :
                                  match.format === 'americano' ? 'bg-purple-100 text-purple-700' :
                                  'bg-green-100 text-green-700'
                                }`}>
                                  {match.format === 'open' ? 'Open' : match.format === 'americano' ? 'Americano' : 'Mexicano'}
                                </span>
                                {isUpcoming && <span className="px-2 py-0.5 bg-amber-100 text-amber-700 text-xs rounded-full">Upcoming</span>}
                              </div>
                              <p className="text-sm text-gray-600">
                                {new Date(match.date).toLocaleDateString('en-GB')} {match.time && `at ${match.time}`}
                              </p>
                              {match.location && (
                                <p className="text-xs text-gray-500 mt-0.5">📍 {match.location}</p>
                              )}
                              <p className="text-xs text-gray-500 mt-1">
                                {match.players.map(p => p.name).join(', ')}
                              </p>
                            </div>
                            <div className="flex flex-col gap-2">
                              <button
                                onClick={() => generateICS(match)}
                                className="text-indigo-600 hover:text-indigo-700"
                                title="Add to calendar"
                              >
                                <Icon name="calendar" className="w-5 h-5" />
                              </button>
                              <button onClick={() => setMatches(matches.filter(m => m.id !== match.id))} className="text-gray-400 hover:text-red-500">
                                <Icon name="trash-2" className="w-4 h-4" />
                              </button>
                            </div>
                          </div>

                          {!isUpcoming && (
                            <>
                              <div className="mb-3 pb-3 border-b">
                                <div className="flex justify-between text-sm">
                                  <span className="text-gray-600">Fee:</span>
                                  <span className="font-semibold">£{match.courtFee.toFixed(2)}</span>
                                </div>
                                <div className="flex justify-between text-sm mt-1">
                                  <span className="text-gray-600">Per Player:</span>
                                  <span className="font-semibold text-indigo-600">£{(match.courtFee / match.players.length).toFixed(2)}</span>
                                </div>
                              </div>

                              <div className="grid grid-cols-2 gap-2">
                                {match.players.map(player => (
                                  <div
                                    key={player.id}
                                    onClick={() => togglePayment(match.id, player.id)}
                                    className="flex items-center justify-between p-2 rounded-lg hover:bg-gray-50 cursor-pointer"
                                  >
                                    <span className="text-sm">{player.name}</span>
                                    {player.paid ? <Icon name="check-circle" className="w-4 h-4 text-green-500" /> : <Icon name="x-circle" className="w-4 h-4 text-gray-300" />}
                                  </div>
                                ))}
                              </div>
                            </>
                          )}
                        </div>
                      );
                    })}

                    {showNewMatch && (
                      <div className="bg-white rounded-lg shadow-sm p-4">
                        <h3 className="font-semibold mb-4">New Match</h3>
                        
                        <div className="space-y-4">
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block text-sm font-medium mb-1">Date</label>
                              <input
                                type="date"
                                value={newMatch.date}
                                onChange={(e) => setNewMatch({ ...newMatch, date: e.target.value })}
                                className="w-full px-3 py-2 border rounded-lg text-sm"
                              />
                            </div>
                            <div>
                              <label className="block text-sm font-medium mb-1">Time</label>
                              <input
                                type="time"
                                value={newMatch.time}
                                onChange={(e) => setNewMatch({ ...newMatch, time: e.target.value })}
                                className="w-full px-3 py-2 border rounded-lg text-sm"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-medium mb-2">Format</label>
                            <div className="grid grid-cols-3 gap-2">
                              {['open', 'americano', 'mexicano'].map(fmt => (
                                <button
                                  key={fmt}
                                  onClick={() => setNewMatch({ ...newMatch, format: fmt })}
                                  className={`p-2 rounded-lg border-2 text-xs ${
                                    newMatch.format === fmt ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200'
                                  }`}
                                >
                                  {fmt.charAt(0).toUpperCase() + fmt.slice(1)}
                                </button>
                              ))}
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-medium mb-1">Location</label>
                            <select
                              value={newMatch.location}
                              onChange={(e) => setNewMatch({ ...newMatch, location: e.target.value })}
                              className="w-full px-3 py-2 border rounded-lg text-sm"
                            >
                              <option value="">Select location</option>
                              {locations.map(loc => (
                                <option key={loc} value={loc}>{loc}</option>
                              ))}
                            </select>
                          </div>

                          <div>
                            <label className="block text-sm font-medium mb-1">Courts</label>
                            <select
                              value={newMatch.courts}
                              onChange={(e) => setNewMatch({ ...newMatch, courts: parseInt(e.target.value), selectedPlayers: [] })}
                              className="w-full px-3 py-2 border rounded-lg text-sm"
                            >
                              <option value="1">1 Court (4 players)</option>
                              <option value="2">2 Courts (8 players)</option>
                              <option value="3">3 Courts (12 players)</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-sm font-medium mb-1">Fee (£)</label>
                            <input
                              type="number"
                              step="0.01"
                              value={newMatch.courtFee}
                              onChange={(e) => setNewMatch({ ...newMatch, courtFee: e.target.value })}
                              className="w-full px-3 py-2 border rounded-lg text-sm"
                            />
                            {newMatch.courtFee && newMatch.selectedPlayers.length > 0 && (
                              <p className="text-sm text-gray-600 mt-1">£{feePerPlayer} per player</p>
                            )}
                          </div>

                          <div>
                            <label className="block text-sm font-medium mb-2">
                              Players ({newMatch.selectedPlayers.length}/{newMatch.courts * 4})
                            </label>
                            <div className="grid grid-cols-3 gap-2">
                              {players.map(player => (
                                <button
                                  key={player.id}
                                  onClick={() => togglePlayerSelection(player.id)}
                                  className={`p-2 rounded-lg border-2 text-xs ${
                                    newMatch.selectedPlayers.includes(player.id)
                                      ? 'border-indigo-500 bg-indigo-50'
                                      : 'border-gray-200'
                                  }`}
                                >
                                  {player.name}
                                </button>
                              ))}
                            </div>
                          </div>

                          <div className="flex gap-2">
                            <button
                              onClick={createMatch}
                              disabled={newMatch.selectedPlayers.length !== newMatch.courts * 4 || !newMatch.courtFee}
                              className="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 disabled:bg-gray-300 text-sm"
                            >
                              Create
                            </button>
                            <button
                              onClick={() => setShowNewMatch(false)}
                              className="px-4 py-2 border rounded-lg text-gray-700 text-sm"
                            >
                              Cancel
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {view === 'tournament' && (
                  <div className="bg-white rounded-lg shadow-sm p-8 text-center">
                    <div className="text-6xl mb-4">🏆</div>
                    <p className="text-gray-600">No tournaments yet</p>
                  </div>
                )}

                {view === 'stats' && (
                  <div className="bg-white rounded-lg shadow-sm p-8 text-center">
                    <div className="text-6xl mb-4">📊</div>
                    <p className="text-gray-600">No statistics yet</p>
                  </div>
                )}

                {view === 'admin' && (
                  <div className="bg-white rounded-lg shadow-sm p-4">
                    <h3 className="font-semibold mb-4 flex items-center gap-2">
                      <span className="text-lg">💷</span>
                      Outstanding Debts
                    </h3>
                    {totalRevenue === 0 || totalRevenue - totalCollected === 0 ? (
                      <div className="text-center py-8">
                        <div className="text-6xl mb-4">💷</div>
                        <p className="text-gray-600">All paid up!</p>
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {matches.filter(m => m.players.some(p => !p.paid)).map(match => (
                          <div key={match.id} className="border rounded-lg p-3">
                            <div className="font-medium">{new Date(match.date).toLocaleDateString()}</div>
                            {match.players.filter(p => !p.paid).map(p => (
                              <div key={p.id} className="flex justify-between text-sm mt-1">
                                <span>{p.name}</span>
                                <span className="text-red-600 font-medium">£{(match.courtFee / match.players.length).toFixed(2)}</span>
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {view === 'players' && (
                  <div className="space-y-4">
                    {players.map(player => (
                      <div key={player.id} className="bg-white rounded-lg shadow-sm p-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center">
                            <span className="text-indigo-700 font-semibold text-lg">{player.name.charAt(0)}</span>
                          </div>
                          <div className="font-semibold">{player.name}</div>
                        </div>
                        <button
                          onClick={() => {
                            if (isAuthenticated) {
                              setPlayers(players.filter(p => p.id !== player.id));
                              setIsAuthenticated(false);
                            } else {
                              requestAuth('deletePlayer', player.id);
                            }
                          }}
                          className="text-gray-400 hover:text-red-500"
                        >
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    ))}

                    {showNewPlayer && isAuthenticated && (
                      <div className="bg-white rounded-lg shadow-sm p-4">
                        <h3 className="font-semibold mb-3">Add Player</h3>
                        <input
                          type="text"
                          value={newPlayerName}
                          onChange={(e) => setNewPlayerName(e.target.value)}
                          placeholder="Player name"
                          className="w-full px-3 py-2 border rounded-lg mb-3 text-sm"
                          onKeyPress={(e) => e.key === 'Enter' && addPlayer()}
                        />
                        <div className="flex gap-2">
                          <button onClick={addPlayer} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm">
                            Add
                          </button>
                          <button
                            onClick={() => {
                              setShowNewPlayer(false);
                              setNewPlayerName('');
                              setIsAuthenticated(false);
                            }}
                            className="px-4 py-2 border rounded-lg text-sm"
                          >
                            Cancel
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div className="fixed bottom-6 right-6">
                <button
                  onClick={() => {
                    if (view === 'matches') setShowNewMatch(!showNewMatch);
                    else if (view === 'players') {
                      if (isAuthenticated) {
                        setShowNewPlayer(!showNewPlayer);
                      } else {
                        requestAuth('addPlayer');
                      }
                    }
                  }}
                  className={`w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 flex items-center justify-center ${
                    view === 'stats' || view === 'admin' || view === 'tournament' ? 'hidden' : ''
                  }`}
                >
                  <Icon name="plus" className="w-6 h-6" />
                </button>
              </div>

              {showPasswordPrompt && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                  <div className="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full mx-4">
                    <h3 className="text-lg font-semibold mb-4">Admin Authentication</h3>
                    <p className="text-sm text-gray-600 mb-4">Enter password to manage players</p>
                    <input
                      type="password"
                      value={tempPassword}
                      onChange={(e) => setTempPassword(e.target.value)}
                      placeholder="Password"
                      className="w-full px-3 py-2 border rounded-lg mb-4 text-sm"
                      onKeyPress={(e) => e.key === 'Enter' && checkPassword()}
                      autoFocus
                    />
                    <div className="flex gap-2">
                      <button onClick={checkPassword} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-sm">
                        Confirm
                      </button>
                      <button
                        onClick={() => {
                          setShowPasswordPrompt(false);
                          setTempPassword('');
                          setPasswordAction(null);
                          setPlayerToDelete(null);
                        }}
                        className="px-4 py-2 border rounded-lg text-sm"
                      >
                        Cancel
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<PadelTracker />, document.getElementById('root'));
    </script>

    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
              .then(reg => console.log('Service Worker registered'))
              .catch(err => console.log('Service Worker registration failed'));
          });
        }
    </script>
</body>
</html>
